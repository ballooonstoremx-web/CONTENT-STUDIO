<title>Balloon Store Content HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=Inter:wght@400..800&display=swap">
<style>
/* Layout: warm editorial "motherboard" — beige desk, white cards, serif headlines, sans for every number and control.
   Light is the default design; dark only when the viewer explicitly sets data-theme="dark". */
:root{
  --navy:#122D50;--blue:#54C1FA;--pink:#EA4566;--orange:#FF8A00;--yellow:#FFD400;--green:#7ED957;
  --bg:#F7F2E9;--surface:#FFFFFF;--surface2:#F4EEE3;--surface3:#EFE7D9;--fg:#122D50;--muted:#5F6B7A;--line:#E8DFCF;--line2:#D8CBB4;
  --accent:#EA4566;--accentsoft:#FDE6EB;--accentfg:#FFFFFF;--danger:#C2213F;--ok:#3F8A2A;
  --focus:#FFF8D9;--focusline:#F1E2A2;--ink:#122D50;--inkfg:#FFFFFF;--bluesoft:#E3F4FD;--greensoft:#E8F7DF;--yellowsoft:#FFF6C4;
  --shadow:0 1px 2px rgba(18,45,80,.04),0 6px 18px -12px rgba(18,45,80,.18);
  --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:var(--serif);--body:var(--sans);
  --r:16px;
}
:root[data-theme="dark"]{--bg:#14171C;--surface:#1C2129;--surface2:#232A33;--surface3:#2A323D;--fg:#F3EEE4;--muted:#A9B2BF;--line:#2F3843;--line2:#3B4552;--accent:#FF6F8A;--accentsoft:#3A1E26;--accentfg:#14171C;--danger:#FF8A9C;--ok:#9BE77F;--focus:#2B2816;--focusline:#4F4722;--ink:#F3EEE4;--inkfg:#14171C;--bluesoft:#16303F;--greensoft:#1D3218;--yellowsoft:#332D10;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.015em;font-variation-settings:"opsz" 96}
h1{font-size:clamp(1.9rem,3.6vw,2.6rem)}h2{font-size:1.45rem}h3{font-size:1.12rem;letter-spacing:-.005em}
p{margin:.4em 0}
/* ---- Header + navigation ---- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{min-height:100%}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.2) blur(8px);-webkit-backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1400px;margin:0 auto;padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--sans);font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--fg)}
.brand b{font-family:var(--serif);font-size:1.15rem;letter-spacing:-.01em;text-transform:none;font-weight:600}
.brand .sub{color:var(--muted)}
.dots{display:inline-flex;gap:3px}.dots i{width:8px;height:8px;border-radius:50%}
.storage{font-size:.72rem;font-weight:600;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:3px 10px;background:var(--surface)}
.storage::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:1px}
nav.rail{display:flex;flex-wrap:wrap;align-items:center;gap:4px;row-gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 1px;-webkit-overflow-scrolling:touch}
nav.rail::-webkit-scrollbar{display:none}
nav.rail .grp{display:flex;flex:none;align-items:center;gap:4px}
nav.rail a{flex:none;color:var(--fg);text-decoration:none;padding:6px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;transition:background .15s,border-color .15s}
nav.rail a:hover{border-color:var(--fg)}
nav.rail a.on{background:var(--ink);color:var(--inkfg);border-color:var(--ink)}
nav.rail a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
nav.rail .sec{flex:none;font-size:.6rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-left:4px;padding-left:9px;border-left:1px solid var(--line2)}
main{max-width:1280px;margin:0 auto;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;width:100%}
/* ---- Shared building blocks ---- */
.head{display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between;margin-bottom:22px}
.head p{margin:8px 0 0;color:var(--muted);max-width:68ch}
.eyebrow{font-family:var(--sans);font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
details.panel>summary{font-family:var(--serif);font-size:1.1rem;font-weight:600}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.74rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{font:inherit;font-size:.92rem;letter-spacing:0;text-transform:none;color:var(--fg);background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;width:100%}
input[type=checkbox]{width:auto}
textarea{min-height:84px;resize:vertical;line-height:1.5}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button,.btn{font:inherit;font-size:.86rem;font-weight:600;border:1px solid var(--line2);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2;transition:border-color .15s,background .15s}
button:hover,.btn:hover{border-color:var(--fg)}
button.primary{background:var(--ink);color:var(--inkfg);border-color:var(--ink)}
button.primary:hover{background:color-mix(in srgb,var(--ink) 86%,var(--pink))}
button.ghost{background:transparent;border-color:transparent}
button.danger{color:var(--danger)}
button:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:700;letter-spacing:.02em;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--fg);border:1px solid var(--line);white-space:nowrap}
.s-idea{background:var(--yellowsoft);color:#5E4C00;border-color:#F2E08A}.s-borrador{background:var(--bluesoft);color:#0E4F70;border-color:#BFE6FB}.s-revision{background:var(--accentsoft);color:#9A1F3A;border-color:#F6C0CC}.s-terminado{background:var(--greensoft);color:#2D6A1C;border-color:#C6EBB2}
:root[data-theme="dark"] .s-idea,:root[data-theme="dark"] .s-borrador,:root[data-theme="dark"] .s-revision,:root[data-theme="dark"] .s-terminado{color:var(--fg);border-color:var(--line2)}
.t-reel{border-left:3px solid var(--pink)!important}.t-carrusel{border-left:3px solid var(--blue)!important}.t-story{border-left:3px solid var(--yellow)!important}
.warn{background:var(--focus);color:var(--fg);border:1px solid var(--focusline);border-radius:12px;padding:12px 14px;font-size:.88rem}
.err{background:var(--accentsoft);color:var(--danger);border:1px solid #F6C0CC;border-radius:12px;padding:12px 14px;font-size:.88rem}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty h2{color:var(--fg)}
.list{display:flex;flex-direction:column;gap:8px}
.idea{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.idea div{min-width:0}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
main a:not(.btn):not(.panel){color:inherit;text-decoration-color:var(--pink);text-decoration-thickness:1.5px;text-underline-offset:3px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--inkfg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:.86rem;z-index:50;max-width:min(80vw,460px);box-shadow:0 10px 30px -10px rgba(18,45,80,.5)}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--fg);padding:0;width:min(720px,94vw);max-height:90vh;box-shadow:0 30px 80px -30px rgba(18,45,80,.45)}
dialog::backdrop{background:rgba(18,45,80,.35);backdrop-filter:blur(2px)}
dialog form{padding:24px;display:grid;gap:14px;overflow:auto;max-height:88vh}
dialog h2{font-size:1.7rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem;white-space:pre-wrap;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;max-height:340px}
details summary{cursor:pointer}
/* ---- Numbers: always sans, tabular ---- */
.num,.stat b,.bignum,.fstep b,.convs b,.countdown b,.scard .ep,.cal .day .n,.soon .cd,.kpi svg text{font-family:var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
/* ---- Hoy ---- */
.hello{display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between;margin-bottom:22px}
.greet{font-size:clamp(2.4rem,6vw,4rem);font-weight:600;letter-spacing:-.03em;line-height:1}
.greet em{font-style:italic;font-weight:400;font-size:.62em;color:var(--fg);letter-spacing:-.01em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.72rem;line-height:1.3;color:var(--muted);font-weight:600;box-shadow:var(--shadow)}
.kpi svg text{fill:var(--fg)}
.kpi.hot{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg) inset,var(--shadow)}
.today-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.focus{background:var(--focus);border-color:var(--focusline)}
.bignum{font-size:3.4rem;font-weight:700;line-height:1;display:flex;align-items:baseline;gap:10px;margin-top:4px}.bignum span{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
ol.todo{list-style:none;counter-reset:t;margin:14px 0 0;padding:0;display:flex;flex-direction:column}
ol.todo li{counter-increment:t;display:flex;gap:14px;align-items:baseline;padding:10px 0;border-top:1px solid var(--focusline);font-size:.92rem}
ol.todo li::before{content:counter(t);font-family:var(--serif);font-weight:600;font-size:1.05rem;min-width:1em}
ol.todo button{all:unset;cursor:pointer;font-weight:500;overflow-wrap:anywhere}ol.todo button:hover{text-decoration:underline;text-decoration-color:var(--pink)}ol.todo button:focus-visible{outline:2px solid var(--blue)}
.soon{list-style:none;margin:12px 0 14px;padding:0;display:flex;flex-direction:column}
.soon li{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:baseline;font-size:.88rem;padding:7px 0;border-top:1px solid var(--line)}
.soon a{text-decoration:none!important}.soon a:hover{text-decoration:underline!important}
.soon .cd{font-family:var(--serif);font-weight:600;font-size:1rem;color:var(--pink)}
.prog{height:6px;background:var(--surface3);border-radius:99px;overflow:hidden}.prog div{height:100%;background:var(--ink);border-radius:99px}
.camp-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:12px}
.section-title{margin:28px 0 4px}
/* ---- Tablero ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.stat .chip{align-self:start}
.stat b{display:block;font-size:2.2rem;font-weight:700;line-height:1}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.col h3{display:flex;justify-content:space-between;align-items:baseline;margin:2px 4px 12px;font-size:1.05rem}
.col h3 span{font-family:var(--sans);font-size:.8rem;font-weight:700;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;min-width:0;box-shadow:0 1px 1px rgba(18,45,80,.03)}
.card:hover{border-color:var(--line2)}
.card .t{font-weight:600;font-size:.9rem;overflow-wrap:anywhere;line-height:1.35}
.card .m{font-size:.74rem;color:var(--muted);margin-top:4px}
/* ---- Biblioteca ---- */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;display:flex;flex-direction:column;box-shadow:var(--shadow);color:var(--fg)}
.mcard .thumb{aspect-ratio:4/5;background:var(--surface2);display:grid;place-items:center;overflow:hidden;max-width:100%}
.mcard .thumb img,.mcard .thumb video{width:100%;height:100%;object-fit:cover}
.mcard .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;font-size:.8rem}
.mcard.sel{outline:3px solid var(--pink)}
.drop{border:1.5px dashed var(--line2);border-radius:var(--r);padding:32px 20px;text-align:center;background:var(--surface)}
.drop.over{background:var(--bluesoft);border-color:var(--blue)}
/* ---- Editores (carrusel / reel) ---- */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:18px;align-items:start}
.split>.panel[style*="sticky"]{top:calc(118px + env(safe-area-inset-top,0px))!important}
canvas.preview{width:100%;max-width:420px;height:auto;border-radius:12px;border:1px solid var(--line);background:#fff;box-shadow:0 18px 40px -24px rgba(18,45,80,.45)}
.slides{display:flex;flex-direction:column;gap:12px}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;box-shadow:var(--shadow)}
.slide.cur{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg) inset}
.shot{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.shot .thumb{width:92px;aspect-ratio:9/16;background:var(--surface2);border-radius:8px;overflow:hidden}
.shot .thumb img,.shot .thumb video{width:100%;height:100%;object-fit:cover}
.tpl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:1040px}
.tpl-grid figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.tpl-grid figcaption{font-family:var(--serif);font-weight:600;font-size:1.05rem;margin-top:10px}
.tpl-grid canvas{width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
/* ---- Calendario ---- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);padding:4px 6px}
.cal .day{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:100px;padding:6px;min-width:0;font-size:.75rem}
.cal .day.other{background:transparent;opacity:.55}.cal .day.today{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset}
.cal .day .n{font-weight:700;font-size:.85rem}
.cal .ev,.week7 .ev{display:block;width:100%;text-align:left;border-radius:7px;padding:3px 7px;margin-top:4px;font-size:.7rem;font-weight:600;border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---- Campañas ---- */
.countdown{display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--inkfg);border-radius:var(--r);padding:14px 20px;font-size:.86rem}.countdown b{font-size:2.8rem;font-weight:700;line-height:1}.countdown small{opacity:.75}
.runway{position:relative;min-width:620px;padding-top:22px}
.rw-scale{position:relative;height:20px;margin-left:150px;font-size:.68rem;color:var(--muted);font-weight:600}.rw-scale span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.rw-row{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px;align-items:center;margin:8px 0}
.rw-label{font-weight:600;font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw-track{position:relative;height:32px;background:var(--surface2);border:1px solid var(--line);border-radius:10px}
.rw-bar{position:absolute;top:5px;bottom:5px;border-radius:7px;font-size:.66rem;font-weight:700;letter-spacing:.04em;padding:4px 8px;overflow:hidden;white-space:nowrap}
.rw-bar.prep{background:var(--yellowsoft);color:#5E4C00;border:1px solid #F2E08A}.rw-bar.pub{background:var(--pink);color:#fff}
.rw-dot{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--surface);background:var(--blue)}
.rw-dot.s-terminado{background:var(--green)}.rw-dot.s-revision{background:var(--pink)}
.rw-now{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--ink);border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.72rem;color:var(--muted);margin-top:10px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.task.done span:not(.chip){text-decoration:line-through;color:var(--muted)}
.task input[type=checkbox],.fl input[type=checkbox]{width:18px;height:18px;accent-color:var(--ink)}
/* ---- Estudio semanal ---- */
.stepper{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted)}
.stepper button.on{background:var(--ink);color:var(--inkfg);border-color:var(--ink)}
.stepper button.on .chip{background:rgba(255,255,255,.18);color:inherit;border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.chips button{padding:5px 14px;font-size:.78rem}.chips button.on{background:var(--ink);color:var(--inkfg);border-color:var(--ink)}
.series{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.scard h3{font-size:1.3rem}
.scard .ep{font-weight:700;font-size:1.9rem;line-height:1;text-align:right}.scard .ep small{display:block;font-size:.58rem;letter-spacing:.16em;color:var(--muted);font-weight:700;margin-bottom:2px}
.film-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:12px;box-shadow:var(--shadow)}
.film-card .hookline{font-family:var(--serif);font-size:1.7rem;font-weight:600;line-height:1.12;letter-spacing:-.02em}
.film .film-card .hookline{font-size:2.5rem}.film .fl{font-size:1.15rem}
.clap{height:8px;border-radius:4px;background:repeating-linear-gradient(135deg,var(--ink) 0 12px,var(--surface) 12px 24px)}
.fl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.fl.done span{color:var(--muted);text-decoration:line-through}
.week7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;min-width:640px}
.week7 .d{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:120px;font-size:.75rem}
.week7 .d.today{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset}
/* ---- Resultados ---- */
.funnel{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.fstep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;min-width:0;box-shadow:var(--shadow)}

<script>
"use strict";
/* ================= Brand (single source in app; mirrors brand/profile.json) ================= */
const BRAND={name:"Balloon Store",site:"balloonstoreco.com",
  colors:{blue:"#54C1FA",pink:"#EA4566",orange:"#FF8A00",yellow:"#FFD400",green:"#7ED957",navy:"#122D50"},
  lines:["Globos metálicos Anagram","Globos metálicos Kaleidoscope","Látex Sensacional","Varias líneas"],
  audiences:["decoradoras","tiendas de fiestas","revendedores"]};
const STATUSES=[["idea","Ideas"],["borrador","Borradores"],["revision","Pendiente de aprobación"],["terminado","Terminado"]];
const TYPES=[["reel","Reel"],["carrusel","Carrusel"],["story","Stories"]];
const PILLARS=["Educativo","Inspiración","Producto real","Detrás de cámaras","Temporada","Comunidad"];
const OCCASIONS=["cumpleaños","baby shower","graduaciones","bodas y XV años","Día de las Madres","San Valentín","Navidad","fiestas patrias","Halloween y Día de Muertos","eventos corporativos","revelación de género"];
const label=(arr,k)=>(arr.find(a=>a[0]===k)||[k,k])[1];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=(s,r=document)=>r.querySelector(s);const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function toast(msg){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
const slug=s=>String(s||"contenido").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48)||"contenido";
const hasClaude=()=>!!(window.claude&&typeof window.claude.use==="function");
function withTimeout(p,ms){return Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))])}

/* ================= Storage: claude.ai db+assets when hosted, IndexedDB otherwise ================= */
const COLS=["items","media","campaigns","series","catalog","weeks","requests"];
const IDB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open("bs-content-hq",3);r.onupgradeneeded=()=>{const d=r.result;["items","media","blobs","campaigns","series","catalog","weeks","requests"].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};r.onsuccess=()=>{this.db=r.result;res(this)};r.onerror=()=>rej(r.error)})},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=()=>rej(t.error)})},
  all(store){return new Promise((res,rej)=>{const t=this.db.transaction(store,"readonly");const r=t.objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})},
  get(store,key){return new Promise((res,rej)=>{const r=this.db.transaction(store,"readonly").objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  put(store,key,val){return this.tx(store,"readwrite",s=>s.put(val,key))},
  del(store,key){return this.tx(store,"readwrite",s=>s.delete(key))}};
const Store={mode:"idb",cdb:null,assets:null,urls:new Map(),queues:new Map(),
  async init(){
    let cloud=false;
    if(hasClaude()){
      try{this.cdb=await withTimeout(window.claude.use("db"),12000)}catch(e){this.cdb=null}
      if(this.cdb){try{const probe=await withTimeout(this.cdb.collection("items").limit(1).get(),12000);cloud=!!probe}catch(e){cloud=false}}
      try{this.assets=await withTimeout(window.claude.use("assets"),8000)}catch(e){this.assets=null}
    }
    try{await IDB.open()}catch(e){if(!cloud)throw new Error("Este navegador no permite guardar datos (IndexedDB bloqueado). Desactiva el modo privado.")}
    this.mode=cloud?"cloud":"idb";
    if(!cloud&&navigator.storage&&navigator.storage.persist){try{await navigator.storage.persist()}catch(e){}}
  },
  async load(){
    if(this.mode==="cloud"){
      const snaps=await Promise.all(COLS.map(c=>withTimeout(this.cdb.collection(c).get(),15000)));
      if(snaps.some(x=>!x))throw new Error("La nube no respondió en 15 s. Recarga la página.");
      return Object.fromEntries(COLS.map((c,i)=>[c,snaps[i].docs.map(d=>d.data())]));
    }
    const out={};for(const c of COLS)out[c]=await IDB.all(c);return out;
  },
  clean(o){return JSON.parse(JSON.stringify(o))},
  serial(key,fn){const prev=this.queues.get(key)||Promise.resolve();const next=prev.catch(()=>{}).then(fn);this.queues.set(key,next);return next},
  save(col,obj){const data=this.clean(obj);return this.serial(col+"/"+obj.id,()=>this.mode==="cloud"?this.cdb.collection(col).doc(obj.id).set(data):IDB.put(col,obj.id,data))},
  remove(col,id){return this.serial(col+"/"+id,()=>this.mode==="cloud"?this.cdb.collection(col).doc(id).delete():IDB.del(col,id))},
  async putBlob(file){
    const MAX=20*1024*1024;
    if(this.mode==="cloud"&&this.assets&&file.size<=MAX){
      try{const r=await this.assets.upload(file,{type:file.type});return{kind:"asset",id:r.id}}catch(e){console.warn("assets.upload",e)}
    }
    if(!IDB.db)throw new Error("No hay almacenamiento disponible para archivos.");
    const key=uid();await IDB.put("blobs",key,file);return{kind:"idb",key,localOnly:this.mode==="cloud"};
  },
  async getBlob(ref){
    if(!ref)return null;
    if(ref.kind==="asset"){const r=await fetch("/_blob/"+ref.id);if(!r.ok)throw new Error("No se pudo leer el archivo "+ref.id);return await r.blob()}
    if(!IDB.db)return null;return(await IDB.get("blobs",ref.key))||null;
  },
  async url(ref){
    if(!ref)return"";const k=ref.kind==="asset"?ref.id:ref.key;
    if(this.urls.has(k))return this.urls.get(k);
    const b=await this.getBlob(ref);if(!b)return"";const u=URL.createObjectURL(b);this.urls.set(k,u);return u;
  },
  async dropBlob(ref){
    if(!ref)return;
    try{if(ref.kind==="asset"&&this.assets)await this.assets.delete(ref.id);else if(ref.kind==="idb"&&IDB.db)await IDB.del("blobs",ref.key)}catch(e){console.warn(e)}
  }
};

/* ================= Downloads ================= */
let dlCap;
async function saveFile(name,blob){
  if(hasClaude()){
    if(dlCap===undefined){try{dlCap=await withTimeout(window.claude.use("downloads"),8000)}catch(e){dlCap=null}}
    if(dlCap){
      try{await dlCap.save({filename:name,data:blob});toast("Descargado: "+name);return true}
      catch(e){const c=e&&e.code;toast(c==="declined"?"Descarga cancelada":"No se pudo descargar ("+(c||"error")+")");return false}
    }
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast("Descargado: "+name);return true;
}

/* ================= ZIP writer (STORE, CRC32) — no external dependency ================= */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
async function makeZip(files){ // files: [{name, data: Blob|string}]
  const enc=new TextEncoder();const parts=[];const central=[];let offset=0;
  const now=new Date();const dosT=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);const dosD=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  for(const f of files){
    const data=typeof f.data==="string"?enc.encode(f.data):new Uint8Array(await f.data.arrayBuffer());
    const name=enc.encode(f.name);const crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,dosT,true);lh.setUint16(12,dosD,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(lh.buffer,name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,dosT,true);ch.setUint16(14,dosD,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,name.length,true);ch.setUint32(42,offset,true);
    central.push(ch.buffer,name);offset+=30+name.length+data.length;
  }
  const cSize=central.reduce((s,p)=>s+(p.byteLength??p.length),0);
  const end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cSize,true);end.setUint32(16,offset,true);
  return new Blob([...parts,...central,end.buffer],{type:"application/zip"});
}

/* ================= State ================= */
const S={items:[],media:[],campaigns:[],series:[],catalog:[],weeks:[],requests:[],curCamp:null,week:null,studioStep:1,seriesFilter:"",resPeriod:"todo",cur:{carrusel:null,reel:null,copy:null},calMonth:null,libFilter:"",slideIdx:0,ideas:[]};
const item=id=>S.items.find(i=>i.id===id);
const mediaById=id=>S.media.find(m=>m.id===id);
function newItem(p={}){return Object.assign({id:uid(),type:"reel",title:"Contenido sin título",status:"idea",date:"",pillar:"",occasion:"",line:"",audience:"decoradoras",hook:"",script:"",caption:"",cta:"",notes:"",slides:[],shots:[],metrics:{},campaignId:"",seriesId:"",ep:0,filmChecks:{},frames:[],storyMedia:"",objective:"",productId:"",pending:[],captionFb:"",weekId:"",example:false,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},p)}

function genIdeas({type,occasion,line,audience,count}){
  const out=[];const types=type==="todos"?["reel","carrusel","story"]:[type];
  let n=0;const seed=Math.floor(Math.random()*100);
  while(out.length<count&&n<60){const t=types[n%types.length];const bank=IDEA_BANK[t];const tpl=pick(bank,seed+n);
    const o=occasion==="variado"?pick(OCCASIONS,seed+n*3):occasion;const l=line;
    const title=tpl[0].replace("{o}",o).replace("{l}",l).replace("{a}",audience);
    if(!out.some(x=>x.title===title))out.push({type:t,title,pillar:tpl[1],notes:tpl[2],occasion:o,line:l,audience});n++}
  return out;
}

  const p=new Promise(res=>{

      v.onloadeddata=()=>{v.currentTime=Math.min(0.5,(v.duration||1)/2)};v.onseeked=()=>{const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);res(c)};v.onerror=()=>res(null);setTimeout(()=>res(null),8000)}

function wrap(ctx,text,maxW){const words=String(text||"").split(/\s+/).filter(Boolean);const lines=[];let line="";
  for(let w of words){while(ctx.measureText(w).width>maxW&&w.length>1){let k=w.length-1;while(k>1&&ctx.measureText(w.slice(0,k)).width>maxW)k--;if(line){lines.push(line);line=""}lines.push(w.slice(0,k));w=w.slice(k)}const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}if(line)lines.push(line);return lines}

  let lines=[];String(text||"").split("\n").forEach(p=>lines.push(...wrap(ctx,p,maxW)));if(lines.length>maxLines)RENDER_CUT.push(String(text).replace(/\s+/g," ").slice(0,70));lines=lines.slice(0,maxLines);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*size*lh));return y+lines.length*size*lh}

  const x=c.getContext("2d",{willReadFrequently:true});x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height).data;

    const bw=(x1-x0+1)/sc,bh=(y1-y0+1)/sc;if(bw*bh<W*H*.8){const o=document.createElement("canvas");o.width=Math.round(bw);o.height=Math.round(bh);const ox=o.getContext("2d");ox.fillStyle="#fff";ox.fillRect(0,0,o.width,o.height);ox.drawImage(img,x0/sc,y0/sc,bw,bh,0,0,bw,bh);out=o}}}catch(e){out=img}

VIEWS.biblioteca=main=>{
  const tags=[...new Set(S.media.flatMap(m=>m.tags||[]))].sort();
  const flt=S.libFilter;const list=S.media.filter(m=>!flt||(m.tags||[]).includes(flt)||(flt==="video"&&m.mime.startsWith("video"))||(flt==="foto"&&m.mime.startsWith("image"))).sort((a,b)=>a.createdAt<b.createdAt?1:-1);
  main.innerHTML=head("Biblioteca de fotos y videos","Sube material real: fotos de producto, clips de montajes, bodega y empaques. Etiqueta con el producto exacto para encontrarlo después. Etiqueta tu logotipo con “logo” para usarlo en las plantillas.")+
  `<div class="drop" id="drop"><p><b>Arrastra fotos o videos aquí</b> o</p><button class="primary" id="pick">Elegir archivos</button><p class="m" style="color:var(--muted);font-size:.8rem;margin-bottom:0">${Store.mode==="cloud"?"Se guardan en tu espacio de Claude (máx. 20 MB por archivo; los más grandes quedan solo en este navegador).":"Se guardan en este navegador."}</p><div id="upl"></div></div>
  <div class="row" style="margin:14px 0"><label style="flex-direction:row;align-items:center;gap:8px">Filtrar<select id="flt"><option value="">Todo (${S.media.length})</option><option value="foto">Fotos</option><option value="video">Videos</option>${tags.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("")}</select></label></div>
  <div class="media-grid" id="mg">${list.length?"":'<div class="empty">Sin archivos todavía.</div>'}</div>`;
  $("#flt",main).value=flt;$("#flt",main).onchange=e=>{S.libFilter=e.target.value;route()};
  $("#pick",main).onclick=()=>$("#filePick").click();
  const drop=$("#drop",main);drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")};drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");uploadFiles([...e.dataTransfer.files])};
  const mg=$("#mg",main);
  list.forEach(m=>{const el=document.createElement("div");el.className="mcard";
    el.innerHTML=`<div class="thumb"></div><div class="body"><b style="overflow-wrap:anywhere">${esc(m.name)}</b><span style="color:var(--muted)">${m.mime.startsWith("video")?"Video"+(m.duration?" · "+m.duration.toFixed(1)+" s":""):"Foto"+(m.width?" · "+m.width+"×"+m.height:"")} · ${(m.size/1048576).toFixed(1)} MB${m.ref&&m.ref.localOnly?" · solo este navegador":""}</span>
      <label>Etiquetas (separa con comas)<input data-tags value="${esc((m.tags||[]).join(", "))}" placeholder="producto exacto, ocasión, color"></label>
      <div class="row"><button data-dl>Descargar</button><button class="danger" data-rm>Eliminar</button></div><div data-cf></div></div>`;
    mg.appendChild(el);
    Store.url(m.ref).then(u=>{if(!u)return;const t=$(".thumb",el);t.innerHTML=m.mime.startsWith("video")?`<video src="${u}" muted playsinline preload="metadata" controls></video>`:`<img src="${u}" alt="${esc(m.name)}">`});
    $("[data-tags]",el).onchange=e=>{m.tags=e.target.value.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);Store.save("media",m).then(()=>toast("Etiquetas guardadas"))};
    $("[data-dl]",el).onclick=async()=>{const b=await Store.getBlob(m.ref);if(b)saveFile(m.name,b);else toast("Archivo no disponible en este navegador")};
    $("[data-rm]",el).onclick=()=>{const used=S.items.filter(i=>i.slides.some(s=>s.mediaId===m.id)||i.shots.some(s=>s.mediaId===m.id));
      $("[data-cf]",el).innerHTML=`<p style="margin:0">${used.length?"Se usa en "+used.length+" contenido(s). ":""}¿Eliminar?</p><button class="danger" data-yes>Sí, eliminar</button>`;
      $("[data-yes]",el).onclick=async()=>{used.forEach(i=>{i.slides.forEach(s=>{if(s.mediaId===m.id)s.mediaId=""});i.shots=i.shots.filter(s=>s.mediaId!==m.id);touch(i,true)});
        if(!m.catalogId)await Store.dropBlob(m.ref);await Store.remove("media",m.id);S.media=S.media.filter(x=>x.id!==m.id);imgCache.delete(m.id);toast("Archivo eliminado");route()}};
  });
};
$("#filePick").onchange=e=>{uploadFiles([...e.target.files]);e.target.value=""};
function probe(file,url){return new Promise(res=>{
  if(file.type.startsWith("video")){const v=document.createElement("video");v.preload="metadata";v.muted=true;v.onloadedmetadata=()=>res({duration:v.duration||0,width:v.videoWidth,height:v.videoHeight});v.onerror=()=>res({});v.src=url;setTimeout(()=>res({}),6000)}
  else{const i=new Image();i.onload=()=>res({width:i.naturalWidth,height:i.naturalHeight});i.onerror=()=>res({});i.src=url}})}
async function uploadFiles(files){
  const ok=files.filter(f=>/^(image|video)\//.test(f.type));if(ok.length<files.length)toast("Solo se aceptan fotos y videos");
  const box=$("#upl");let done=0;
  for(const f of ok){if(box)box.textContent=`Subiendo ${done+1} de ${ok.length}: ${f.name}`;
    try{const tmp=URL.createObjectURL(f);const meta=await probe(f,tmp);URL.revokeObjectURL(tmp);
      const ref=await Store.putBlob(f);
      const m={id:uid(),name:f.name,mime:f.type,size:f.size,tags:[],ref,createdAt:new Date().toISOString(),...meta};
      await Store.save("media",m);S.media.push(m);done++}
    catch(e){toast("No se subió "+f.name+": "+(e.message||e.code||e))}}
  toast(`${done} archivo(s) guardado(s)`);if((location.hash||"#panel")==="#biblioteca")route();
}

const fmtT=s=>{const m=Math.floor(s/60),r=(s-m*60);return String(m).padStart(2,"0")+":"+r.toFixed(1).padStart(4,"0")};
const srtT=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=Math.floor(s%60),ms=Math.round((s-Math.floor(s))*1000);return`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")},${String(ms).padStart(3,"0")}`};

function capcutGuide(it,tl){const total=tl.length?tl[tl.length-1].end:0;
  return`# Instrucciones de edición en CapCut — ${it.title}

Duración estimada: ${total.toFixed(1)} s · ${tl.length} tomas · Formato 9:16

## 1. Proyecto
1. Abre CapCut (escritorio o móvil) → **Nuevo proyecto**.
2. Relación de aspecto **9:16**. En escritorio: Proyecto 1080×1920, 30 fps.
3. Importa la carpeta \`clips/\` de este paquete. Los archivos ya están numerados en el orden de la línea de tiempo.

## 2. Línea de tiempo
| # | Archivo | Recorte dentro del clip | Posición en el Reel | Texto en pantalla | Voz en off | Nota de edición |
|---|---|---|---|---|---|---|
${tl.map(r=>`| ${r.n} | ${r.file} | ${r.isV?fmtT(r.in)+" → "+fmtT(r.out):"foto · "+r.dur.toFixed(1)+" s"} | ${fmtT(r.start)} → ${fmtT(r.end)} | ${(r.text||"—").replace(/\|/g,"/")} | ${(r.voice||"—").replace(/\|/g,"/")} | ${(r.note||"—").replace(/\|/g,"/")} |`).join("\n")}

Pasos:
1. Arrastra los clips en orden 01, 02, 03… a la pista principal.
2. Recorta cada clip a los tiempos de “Recorte dentro del clip” (selecciona el clip → Dividir en la entrada y en la salida → elimina el resto).
3. Para fotos, ajusta la duración indicada. Usa “Ken Burns”/zoom suave si quieres movimiento.
4. Encuadre: si el clip es horizontal, usa **Lienzo → Desenfoque** o recorta a 9:16 manteniendo el producto completo y visible.

## 3. Textos y subtítulos
- Importa \`subtitulos.srt\` (Texto → Subtítulos → Importar subtítulos). Si tu versión no lo permite, usa **Subtítulos automáticos** y corrígelos con \`textos-en-pantalla.txt\`.
- Hook en pantalla los primeros 3 s: “${it.hook||it.title}”.
- Zona segura: deja libres ~220 px arriba y ~420 px abajo (interfaz de Instagram).
- Tipografía sugerida: gruesa y redondeada; colores de marca azul #54C1FA, rosa #EA4566, amarillo #FFD400 sobre azul marino #122D50.

## 4. Audio
- Graba la voz en off con el guion de \`guion.txt\` (o usa los textos por toma de la tabla).
- Música: solo de la biblioteca de CapCut con licencia comercial o audio original. No uses canciones con derechos en una cuenta de empresa.
- Baja la música a −18/−20 dB cuando haya voz.

## 5. Portada y exportación
- Usa \`portada-1080x1920.png\` como portada al subir el Reel.
- Exporta: resolución 1080p, 30 fps, MP4, tasa de bits recomendada.
- Revisión final: producto real visible, sin precios ni existencias no confirmadas, sin texto marcado ${PH}.

Esta herramienta no publica en redes sociales; la publicación es manual y requiere aprobación.
`}

  const c=document.createElement("canvas");await renderReelCover(c,it);files.push({name:"portada-1080x1920.png",data:await canvasBlob(c)});

  files.push({name:"copy-instagram.txt",data:it.caption||genCaption(it)});
  files.push({name:"LEEME.txt",data:`Paquete de Reel: ${it.title}\n1. Descomprime este ZIP.\n2. Sigue instrucciones-capcut.md.\n3. Material incluido: ${tl.length} archivo(s) real(es) en /clips.\nEsta herramienta no publica en redes sociales.\n`});

}

/* ================= Date helpers ================= */
const DAY=86400000;
const isoD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseD=s=>{const[y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return isoD(d)};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/DAY);
const weekStart=s=>{const d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return isoD(d)};
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESL=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const fmtShort=s=>{const d=parseD(s);return d.getDate()+" "+MES[d.getMonth()]};
const fmtLong=s=>{const d=parseD(s);return DIAS[d.getDay()]+" "+d.getDate()+" de "+MESL[d.getMonth()]};
function seasons(from){const y=+from.slice(0,4);const out=[];
  for(const yr of[y,y+1]){const j=new Date(yr,5,1);const fathers=isoD(new Date(yr,5,1+((7-j.getDay())%7)+14));
    out.push([`${yr}-01-06`,"Día de Reyes"],[`${yr}-02-14`,"San Valentín"],[`${yr}-04-30`,"Día del Niño"],[`${yr}-05-10`,"Día de las Madres"],[fathers,"Día del Padre"],[`${yr}-09-15`,"Fiestas patrias"],[`${yr}-10-31`,"Halloween"],[`${yr}-11-02`,"Día de Muertos"],[`${yr}-12-25`,"Navidad"],[`${yr}-12-31`,"Año Nuevo"])}
  return out.filter(([d])=>d>=from).sort((a,b)=>a[0]>b[0]?1:-1)}
function ring(v,max,color,big,lbl,hot){const p=max>0?Math.max(0,Math.min(1,v/max)):0;const r=26,c=2*Math.PI*r;
  return`<div class="kpi${hot?" hot":""}"><svg viewBox="0 0 64 64" width="66" height="66" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--surface3)" stroke-width="5"/>${p>0?`<circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(p*c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 32 32)"/>`:""}<text x="32" y="38" text-anchor="middle" font-size="${String(big).length>4?13:16}" font-weight="700">${esc(big)}</text></svg><span>${esc(lbl)}</span></div>`}
const missingPhoto=i=>i.type==="carrusel"&&i.slides.some(s=>s.template==="producto"&&!s.mediaId);
const missingFootage=i=>i.type==="reel"&&!i.shots.length&&["borrador","revision"].includes(i.status);

/* ---- Attention engine: derived only from the user's own data ---- */
function attention(){const t=today();const out=[];
  S.items.forEach(i=>{if(i.status==="terminado")return;
    if(i.date&&i.date<t)out.push({p:0,txt:`Atrasado desde ${fmtShort(i.date)}: ${i.title}`,id:i.id});
    else if(i.status==="revision")out.push({p:1,txt:`Aprobar: ${i.title}`,id:i.id});
    else if(i.date&&daysBetween(t,i.date)<=2)out.push({p:2,txt:`Terminar antes del ${fmtShort(i.date)}: ${i.title}`,id:i.id});
    if(missingPhoto(i))out.push({p:3,txt:`Subir foto real del producto: ${i.title}`,go:"#biblioteca"});
    if(missingFootage(i))out.push({p:3,txt:`Agregar material real al Reel: ${i.title}`,reel:i.id})});
  S.campaigns.forEach(c=>(c.tasks||[]).forEach(k=>{if(!k.done&&k.due&&k.due<=t)out.push({p:k.due<t?0:2,txt:`${c.name}: ${k.text}`,camp:c.id})}));
  return out.sort((a,b)=>a.p-b.p)}
function bindAttention(root,list){$$("[data-att]",root).forEach(b=>b.onclick=()=>{const a=list[+b.dataset.att];

function bindCampaign(main,c,t){

/* ---- Resultados (embudo con datos capturados por el usuario) ---- */
const MET=[["reach","Alcance"],["likes","Me gusta"],["comments","Comentarios"],["saves","Guardados"],["shares","Compartidos"],["profile","Visitas al perfil"],["clicks","Clics al sitio"],["dms","Mensajes"],["orders","Pedidos atribuidos"],["revenue","Ventas atribuidas (MXN)"]];
const PLATFORMS=["Instagram","Facebook","Ambas"];
const CMP_BY=[["type","Formato"],["objective","Objetivo"],["product","Producto"],["pillar","Pilar"],["platform","Plataforma"],["dow","Día de la semana"]];
function cmpKey(i,by){if(by==="type")return label(TYPES,i.type);if(by==="product"){const p=catById(i.productId);return p?p.title:"(sin producto)"}if(by==="platform")return(i.metrics||{}).platform||"Sin especificar";if(by==="dow")return i.date?DIAS[parseD(i.date).getDay()]:"(sin fecha)";return i[by]||"(sin dato)"}
function compareRows(list,by){const g={};list.forEach(i=>{const k=cmpKey(i,by);(g[k]=g[k]||[]).push(i)});const sum=a=>a.reduce((x,y)=>x+y,0);const avg=a=>a.length?sum(a)/a.length:null;
  return Object.entries(g).map(([k,arr])=>{const v=f=>arr.map(i=>num(i.metrics[f])).filter(x=>x!=null);
    const rate=arr.map(i=>{const r=num(i.metrics.reach);return r?["likes","comments","saves","shares"].map(f=>num(i.metrics[f])||0).reduce((a,b)=>a+b,0)/r*100:null}).filter(x=>x!=null);
    const ctr=arr.map(i=>{const r=num(i.metrics.reach),c=num(i.metrics.clicks);return r&&c!=null?c/r*100:null}).filter(x=>x!=null);
    return{k,n:arr.length,reach:avg(v("reach")),rate:avg(rate),ctr:avg(ctr),orders:v("orders").length?sum(v("orders")):null,revenue:v("revenue").length?sum(v("revenue")):null}}).sort((a,b)=>(b.rate||0)-(a.rate||0))}
function compareHTML(list,by){const rows=compareRows(list,by);const max=Math.max(1,...rows.map(r=>r.rate||0));const f=(n,d=0)=>n==null?"—":n.toLocaleString("es-MX",{maximumFractionDigits:d});
  return`<div class="panel" style="margin-top:12px"><div class="row" style="justify-content:space-between;align-items:end"><div><div class="eyebrow">Captura manual · sin conexión verificada con Meta</div><h2>Comparar publicaciones</h2></div>
  <label style="min-width:200px">Comparar por<select id="cmp_by">${CMP_BY.map(([k,l])=>`<option value="${k}" ${k===by?"selected":""}>${l}</option>`).join("")}</select></label></div>

      images.push({ref,alt:str(im.alt,200),width:+im.width||0,height:+im.height||0,sha256:str(im.sha256,64),size:blob.size})}

const FAB_OBJ={reel:["Educativo","Demostrativo"],carrusel:["Producto","Consejo"],story:["Novedad","Interacción","Venta"]};
const nextMonday=()=>{const t=today();const w=weekStart(t);return w<=t?addD(w,7):w};
function fabState(){if(!S.fab)S.fab={start:nextMonday(),productIds:[],notes:"",audience:"decoradoras",busy:false,regen:null};return S.fab}
function fabProducts(f){const chosen=f.productIds.map(catById).filter(Boolean);if(chosen.length)return chosen;
  const withPhoto=S.catalog.filter(p=>catImageRef(p)).sort((a,b)=>a.title.localeCompare(b.title,"es")||a.id.localeCompare(b.id));const seen=new Set();const out=[];
  for(const p of withPhoto){const k=(p.tags||[]).find(t=>/números|estrella|orbz|baby shower|graduación|navidad|cumpleaños|perla|pastel/i.test(t))||p.type;if(!seen.has(k)){seen.add(k);out.push(p)}if(out.length>=7)break}
  for(const p of withPhoto){if(out.length>=7)break;if(!out.includes(p))out.push(p)}
  return out}
function fabSlots(f){const prods=fabProducts(f);const n=prods.length;const out=[];
  for(let d=0;d<7;d++){const date=addD(f.start,d);[["reel",FAB_OBJ.reel[d%2]],["carrusel",FAB_OBJ.carrusel[d%2]],["story",FAB_OBJ.story[d%3]]].forEach(([fmt,obj],k)=>{
    const p=n?prods[(d+k)%n]:null;out.push({id:`${date}-${k+1}`,date,day:d,format:fmt,objective:obj,productId:p?p.id:""})})}
  return out}
const weekDoc=start=>S.weeks.find(w=>w.id==="week-"+start);
const weekPlan=f=>{const d=weekDoc(f.start);return d&&Array.isArray(d.planSlots)&&d.planSlots.length===21?d.planSlots:fabSlots(f)};
async function savePlan(f){const d=weekDoc(f.start)||{id:"week-"+f.start,start:f.start,proposals:[],createdAt:new Date().toISOString()};d.planSlots=fabSlots(f);d.audience=f.audience;await saveWeek(d);return d.planSlots}
function fabMaterials(p){const lib=productMedia(p);return{photo:!!catImageRef(p)||lib.some(m=>(m.mime||"").startsWith("image")),video:lib.some(m=>(m.mime||"").startsWith("video")),lib}}
function buildWeekPrompt(slots,f,extra){
  const prods=[...new Set(slots.map(s=>s.productId).filter(Boolean))].map(catById).filter(Boolean);const pid=p=>"P"+(prods.indexOf(p)+1);
  const mediaLines=[];prods.forEach(p=>fabMaterials(p).lib.filter(m=>!m.catalogId).forEach(m=>mediaLines.push(`- ${m.name} (${(m.mime||"").startsWith("video")?"video":"foto"}${m.duration?`, ${m.duration.toFixed(1)} s`:""}) · producto ${pid(p)}${(m.tags||[]).length?` · etiquetas: ${m.tags.join(", ")}`:""}`)));
  const slotLine=s=>{const p=catById(s.productId);const mt=p?fabMaterials(p):{photo:false,video:false};
    return`- slot ${s.id} · ${DIAS[parseD(s.date).getDay()]} ${fmtShort(s.date)} · ${s.format} · objetivo ${s.objective} · producto ${p?pid(p):"(ninguno: tema general)"} · material: ${mt.photo?"foto real disponible":"sin foto"}${s.format==="reel"?(mt.video?", video real disponible":", sin video (pide la grabación en needs)"):""}`};
  return `Eres el equipo de contenido de Balloon Store (${BRAND.site}), venta de globos al mayoreo en México.
PÚBLICO: ${f.audience} en México (también ${BRAND.audiences.filter(x=>x!==f.audience).join(" y ")}). Clientes B2B que compran para decorar o revender.
VOZ: español de México, tuteo, cercana, clara, festiva y práctica. Frases cortas.

REGLAS OBLIGATORIAS
1. No inventes productos, modelos, empaques, precios, descuentos, existencias, tiempos de entrega ni promociones. No menciones precios ni inventario.
2. Usa solo los datos de PRODUCTOS. Cualquier dato específico que no esté ahí escríbelo como [confirmar con catálogo real].
3. Los productos se muestran solo con fotos o video reales. Si una pieza necesita una toma o foto que no existe, pídela en "needs" con descripción concreta. Nunca propongas generar o ilustrar el producto.
4. Llamadas a la acción sin precios (ej.: ${CTAS.slice(0,3).join(" / ")}).
5. Hooks de máximo 9 palabras; texto en pantalla de máximo 7 palabras.

PRODUCTOS (datos confirmados de la tienda)
${prods.map(p=>`[${pid(p)}]\n${catFacts(p)}`).join("\n\n")||"(sin productos: usa temas generales de decoración con globos)"}

MATERIAL REAL EN BIBLIOTECA
${mediaLines.join("\n")||"(solo fotos oficiales del catálogo)"}
${f.notes?`\nNOTAS DEL EQUIPO: ${f.notes}\n`:""}${extra?`\nINDICACIÓN PARA ESTA VERSIÓN: ${extra}\n`:""}
PIEZAS A PROPONER (una propuesta por slot, con el mismo "slot")
${slots.map(slotLine).join("\n")}

OBJETIVOS: Educativo = enseña algo útil a la decoradora; Demostrativo = muestra el producto en uso; Producto = presenta el producto y sus usos; Consejo = tips prácticos; Novedad = qué hay o qué llegó (sin hablar de existencias); Interacción = encuesta, quiz o preguntas; Venta = invita a pedir o ver el catálogo, sin precios.
- reel: 15 a 30 s, 4 a 6 tomas con duración, texto en pantalla, voz, nota de edición y "footage" (la toma real que se necesita).
- carrusel: 5 a 7 diapositivas; plantillas portada, tip, lista, producto (usa la foto real), foto, cta; primera portada y última cta.
- story: 3 a 5 historias con texto y sticker sugerido.
- "caption" es para Instagram (con hashtags aparte). "caption_fb" es la versión para Facebook: más directa, sin hashtags, con el enlace del producto si existe.

FORMATO DE RESPUESTA
Responde solo con JSON válido:
{"proposals":[{"slot":"","type":"reel|carrusel|story","title":"","objective":"","pillar":"${PILLARS.join("|")}","hook":"","caption":"","caption_fb":"","cta":"","hashtags":["#globos"],"slides":[{"template":"portada","headline":"","body":""}],"shots":[{"duration":3,"text":"","voice":"","note":"","footage":""}],"frames":[{"text":"","sticker":"","note":""}],"materials":["material real que usa la pieza"],"needs":["material real que falta"],"verify":["dato a confirmar"]}]}
Incluye "slides" solo en carrusel, "shots" solo en reel y "frames" solo en story.`}
function fabReadiness(p){const prod=catById(p.productId);const mt=fabMaterials(prod);const pend=[];

async function weekFiles(doc){const files=[];const rows=[["fecha","dia","formato","objetivo","producto","titulo","estado","pendiente"]];const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;

    if(!props.length){board.innerHTML=`<div class="panel"><div class="eyebrow">Vista previa del plan</div><div style="overflow-x:auto"><div class="fab-days">${days.map(dt=>`<div class="fab-day"><div class="eyebrow">${DIAS[parseD(dt).getDay()].slice(0,3)} ${parseD(dt).getDate()}</div>${weekPlan(f).filter(s=>s.date===dt).map(s=>{const p=catById(s.productId);return`<div class="fab-slot t-${s.format}"><b>${esc(label(TYPES,s.format))}</b><span>${esc(s.objective)}</span><small>${esc(p?p.title:"Tema general")}</small></div>`}).join("")}</div>`).join("")}</div></div></div>`;return}
    const sel=S.fabSel||(S.fabSel=new Set());const open=props.filter(p=>p.state!=="aprobada"&&p.state!=="descartada");const R=p=>fabReadiness(p);
    const nReady=props.filter(p=>p.state==="aprobada"&&!(item(p.itemId)||{pending:[]}).pending.length).length,nApp=props.filter(p=>p.state==="aprobada").length;
    board.innerHTML=`<div class="fab-bar"><div><div class="eyebrow">Aprobación por lotes</div><h2 style="font-size:1.9rem">${props.length} propuestas · ${nApp} aprobadas</h2>
      <p class="ai-help" style="margin:2px 0 0">${props.filter(p=>R(p).ready).length} con material listo · ${props.filter(p=>!R(p).ready).length} necesitan material real</p></div>
      <div class="row"><button id="fb_all">Seleccionar todas</button><button id="fb_ready">Solo las listas</button><button id="fb_none">Ninguna</button><button class="primary" id="fb_approve" ${sel.size?"":"disabled"}>Aprobar seleccionadas (${sel.size})</button><button id="fb_zip" ${nApp?"":"disabled"}>Exportar aprobadas (ZIP)</button><button class="primary" id="fb_sched" ${nApp?"":"disabled"}>Paquete para programar (IG + FB)</button><a class="btn" href="#calendario" id="fb_cal">Ver en calendario</a></div></div>
      <div style="overflow-x:auto"><div class="fab-days">${days.map(dt=>`<div class="fab-day"><div class="eyebrow">${DIAS[parseD(dt).getDay()]} ${parseD(dt).getDate()} ${MES[parseD(dt).getMonth()]}</div>${props.filter(p=>p.date===dt).map(p=>{const r=R(p);const prod=catById(p.productId);const st=p.state;
        return`<article class="pcard t-${p.type} ${st}" data-slot="${esc(p.slot)}">
          <div class="row" style="justify-content:space-between;gap:6px">${st==="aprobada"?`<span class="chip s-terminado">Aprobada</span>`:st==="descartada"?`<span class="chip">Descartada</span>`:`<label class="ck"><input type="checkbox" data-sel ${sel.has(p.slot)?"checked":""}> Elegir</label>`}<span class="chip">${esc(label(TYPES,p.type))} · ${esc(p.objective)}</span></div>
          <div class="pthumb" data-pimg="${esc(p.productId)}"></div>
          <b class="ptitle">${esc(p.title)}</b><p class="phook">${esc(p.hook)}</p><small class="cat-meta">${esc(prod?prod.title:"Tema general")}</small>
          ${r.ready?`<span class="badge ok">Material listo</span>`:`<span class="badge pend">${p.type==="reel"?"Falta grabación":"Falta foto"}</span>`}${r.confirm?`<span class="badge warnb">Datos por confirmar</span>`:""}${p.ownerReview?`<span class="badge warnb">Revisión final tuya</span>`:""}${r.flags.length?`<span class="badge pend">Revisa: ${esc(r.flags.join(", "))}</span>`:""}
          <details><summary>Ver pieza</summary>${p.slides.length?`<ol class="ai-list">${p.slides.map(s=>`<li>${esc(s.headline)}</li>`).join("")}</ol>`:""}${p.shots.length?`<ol class="ai-list">${p.shots.map(s=>`<li><b>${s.duration}s</b> ${esc(s.text)}${s.footage?`<small> · Toma: ${esc(s.footage)}</small>`:""}</li>`).join("")}</ol>`:""}${p.frames.length?`<ol class="ai-list">${p.frames.map(x=>`<li>${esc(x.text)}${x.sticker?` <span class="chip">${esc(x.sticker)}</span>`:""}</li>`).join("")}</ol>`:""}
            <p style="white-space:pre-wrap"><b>Instagram:</b> ${esc(p.caption)}</p>${p.caption_fb?`<p style="white-space:pre-wrap"><b>Facebook:</b> ${esc(p.caption_fb)}</p>`:""}<p><b>CTA:</b> ${esc(p.cta)}</p>${r.pend.length?`<div class="warn"><b>Pendiente:</b> ${esc(r.pend.join("; "))}</div>`:""}</details>
          ${st==="aprobada"?`<button data-openit>Abrir</button>`:st==="descartada"?`<button data-restore>Recuperar</button>`:`<div class="row" style="gap:6px"><button data-regen>Regenerar</button><button class="ghost danger" data-drop>Descartar</button></div><div data-regenbox hidden><input data-note placeholder="¿Qué cambiar? (opcional)"><button class="primary" data-regengo>Regenerar ahora</button></div>`}
        </article>`}).join("")}</div>`).join("")}</div></div>`+shootPlanHTML(doc);
    $$("[data-pimg]",board).forEach(el=>{const p=catById(el.dataset.pimg);const ref=catImageRef(p);if(ref)Store.url(ref).then(u=>{if(u)el.innerHTML=`<img src="${u}" alt="" loading="lazy">`});else el.remove()});
    const find=el=>props.find(p=>p.slot===el.closest("[data-slot]").dataset.slot);
    $$("[data-sel]",board).forEach(c=>c.onchange=()=>{const p=find(c);c.checked?sel.add(p.slot):sel.delete(p.slot);const b=$("#fb_approve",board);b.disabled=!sel.size;b.textContent=`Aprobar seleccionadas (${sel.size})`});
    $("#fb_all",board).onclick=()=>{open.forEach(p=>sel.add(p.slot));renderBoard()};$("#fb_ready",board).onclick=()=>{sel.clear();open.filter(p=>R(p).ready).forEach(p=>sel.add(p.slot));renderBoard()};$("#fb_none",board).onclick=()=>{sel.clear();renderBoard()};
    $("#fb_approve",board).onclick=async e=>{e.target.disabled=true;let n=0;for(const p of props.filter(x=>sel.has(x.slot)&&x.state!=="aprobada")){await approveProposal(doc,p,doc.source);n++}sel.clear();await saveWeek(doc);
      toast(`${n} pieza(s) aprobadas y agendadas en el calendario`);S.calMonth=parseD(f.start);renderBoard()};
    $("#fb_sched",board).onclick=async e=>{e.target.disabled=true;e.target.textContent="Generando…";try{const r=await scheduleFiles(doc);await saveFile(`programacion-${f.start}.zip`,await makeZip(r.files));toast(`Listos: ${r.cnt.listo} · Por confirmar: ${r.cnt.confirmar} · Falta material: ${r.cnt.material}`)}catch(err){toast(err.message)}finally{e.target.disabled=false;e.target.textContent="Paquete para programar (IG + FB)"}};
    $$("[data-shot]",board).forEach(c=>c.onchange=async()=>{doc.shootChecks={...(doc.shootChecks||{}),[c.dataset.shot]:c.checked};c.closest(".shot-ck").classList.toggle("done",c.checked);const sp=doc.shootPlan||autoShootPlan(doc);const all=sp.stations.flatMap(x=>x.shots||[]);$("#shoot_count",board).textContent=`${all.filter(x=>doc.shootChecks[x.id]).length}/${all.length} tomas`;await saveWeek(doc)});
    const sdl=$("#shoot_dl",board);if(sdl)sdl.onclick=()=>saveFile(`plan-grabacion-${f.start}.txt`,new Blob([shootPlanText(doc.shootPlan||autoShootPlan(doc))],{type:"text/plain"}));
    $("#fb_zip",board).onclick=async e=>{e.target.disabled=true;e.target.textContent="Generando…";try{await saveFile(`semana-${f.start}.zip`,await makeZip(await weekFiles(doc)))}catch(err){toast(err.message)}finally{e.target.disabled=false;e.target.textContent="Exportar aprobadas (ZIP)"}};
    $$("[data-drop]",board).forEach(b=>b.onclick=async()=>{const p=find(b);p.state="descartada";sel.delete(p.slot);await saveWeek(doc);renderBoard()});
    $$("[data-restore]",board).forEach(b=>b.onclick=async()=>{find(b).state="nueva";await saveWeek(doc);renderBoard()});
    $$("[data-openit]",board).forEach(b=>b.onclick=()=>{const p=find(b);const it=item(p.itemId);if(!it)return;if(it.type==="carrusel"||it.type==="reel"){S.cur[it.type]=it.id;location.hash="#"+it.type}else openEditor(it.id)});
    $$("[data-regen]",board).forEach(b=>b.onclick=()=>{const box=$("[data-regenbox]",b.closest("[data-slot]"));box.hidden=!box.hidden});
    $$("[data-regengo]",board).forEach(b=>b.onclick=async()=>{const card=b.closest("[data-slot]");const p=find(b);const note=$("[data-note]",card).value.trim();const slot=weekPlan(f).find(s=>s.id===p.slot&&s.productId===p.productId)||{id:p.slot,date:p.date,format:p.type,objective:p.objective,productId:p.productId};
      const smp=await getSample();const extra=`Propón una versión distinta de “${p.title}”.${note?" "+note:""}`;
      if(!smp||(S.ai&&S.ai.directOff)){f.regen=p.slot;f.regenNote=extra;route();toast("Copia las instrucciones de esta pieza y pégalas en claude.ai");return}
      b.disabled=true;b.innerHTML=`<span class="spin" aria-hidden="true"></span> Regenerando…`;
      try{const data=await smp.json(buildWeekPrompt([slot],f,extra),{cache:false});mergeWeekProposals(doc,parseAIReply(data,5),[slot]);await saveWeek(doc);toast("Pieza regenerada")}catch(e){toast(AI_ERR[e&&e.code]||"No se pudo regenerar")}renderBoard()});
  }
  renderBoard();
};

/* ================= Producción y programación =================
   Shooting checklist for pending Reels and a scheduling package for Instagram + Facebook.
   Nothing here publishes or schedules: the package is for manual upload or a scheduler. */
const pad2=n=>String(n).padStart(2,"0");
const contentText=it=>JSON.stringify([it.title,it.hook,it.caption,it.captionFb,it.cta,it.slides,it.frames,it.script]);
function pubState(it){if((it.pending||[]).length)return"material";if(it.ownerReview)return"confirmar";if(contentText(it).includes("[confirmar")||it.status!=="terminado")return"confirmar";return"listo"}
const PUB_LABEL={listo:"LISTO",confirmar:"CONFIRMAR",material:"FALTA MATERIAL"};
const HOUR_WINDOWS={carrusel:[9,11],reel:[17,20],story:[11,14]},HOUR_DEFAULT={carrusel:10,reel:18,story:12};
function slotHour(doc,net,date,type){const bt=doc.bestTimes&&doc.bestTimes[net];const dow=String(((parseD(date).getDay()+6)%7)+1);const day=bt&&bt[dow];
  if(!day)return{h:HOUR_DEFAULT[type],src:"horario predeterminado (sin datos)"};const[a,b]=HOUR_WINDOWS[type];let best=a,bv=-1;
  for(let h=a;h<=b;h++){const v=+day[h]||0;if(v>bv){bv=v;best=h}}return{h:best,src:doc.bestTimes.source||"datos de audiencia"}}
function pubType(net,type,n){if(type==="carrusel")return net==="Instagram"?`Instagram · Carrusel (${n} imágenes)`:`Facebook · Publicación con ${n} fotos`;
  if(type==="story")return`${net} · Stories (${n} en secuencia)`;return`${net} · Reel`}
function placeholders(it){const out=[];const walk=(v,where)=>{if(typeof v==="string"){const m=v.match(/[^.\n]*\[confirmar[^\]]*\][^.\n]*/g);if(m)m.forEach(x=>out.push(`${where}: ${x.trim()}`))}else if(Array.isArray(v))v.forEach((x,i)=>walk(x,`${where} ${i+1}`));else if(v&&typeof v==="object")Object.values(v).forEach(x=>walk(x,where))};
  walk(it.hook,"Hook");walk(it.caption,"Copy Instagram");walk(it.captionFb,"Copy Facebook");walk(it.cta,"CTA");walk(it.slides,"Diapositiva");walk(it.frames,"Story");return[...new Set(out)]}
async function scheduleFiles(doc){
  const approved=(doc.proposals||[]).filter(p=>p.state==="aprobada"&&item(p.itemId)).sort((a,b)=>a.slot>b.slot?1:-1);
  const tz=(doc.bestTimes&&doc.bestTimes.timezone)||"America/Mexico_City";const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const DIRS={listo:"01_listos_para_programar",confirmar:"02_requieren_confirmacion",material:"03_requieren_material"};
  const head=["pieza","fecha","hora","zona_horaria","dia","red","tipo_publicacion","archivos","texto","enlace","stickers","modo_publicacion","estado","publicable","motivo","fuente_horario"];
  const rows=[head];const files=[];const cnt={listo:0,confirmar:0,material:0};
  for(const p of approved){const it=item(p.itemId);let st=pubState(it);const prod=catById(p.productId);RENDER_CUT.length=0;
    const hIG=slotHour(doc,"instagram",it.date,it.type),hFB=slotHour(doc,"facebook",it.date,it.type);const dow=DIAS[parseD(it.date).getDay()].slice(0,3);
    const base=`${DIRS[st]}/${it.date}_${pad2(hIG.h)}00_${slug(dow)}_${it.type}_${slug(it.title).slice(0,36)}/`;let media=[];
    try{if(it.type==="carrusel"){const sl=(await carouselFiles(it)).filter(f=>f.name.startsWith("slides/"));media=[];for(let i=0;i<sl.length;i++)media.push({name:`${pad2(i+1)}_1080x1350.jpg`,data:await pngToJpeg(sl[i].data)})}
      else if(it.type==="story"&&(it.frames||[]).length){const fr=(await storyFiles(it,true)).filter(f=>f.name.startsWith("stories/"));media=[];for(let i=0;i<fr.length;i++)media.push({name:`story_${pad2(i+1)}_1080x1920.jpg`,data:await pngToJpeg(fr[i].data)})}
      else if(it.type==="reel"){if(st!=="material"&&it.shots.some(s=>((mediaById(s.mediaId)||{}).mime||"").startsWith("video")))media=(await reelFiles(it)).map(f=>({name:"capcut/"+f.name,data:f.data}));
        else{const c=document.createElement("canvas");await renderReelCover(c,it);media=[{name:"portada_1080x1920.jpg",data:await pngToJpeg(await canvasBlob(c))}]}}}catch(e){media=[]}
    const cut=[...new Set(RENDER_CUT)];if(st==="listo"&&cut.length)st="confirmar";cnt[st]++;
    const manual=it.type==="story"&&(it.frames||[]).some(f=>f.sticker);
    const ig=[it.caption,it.cta&&!(it.caption||"").includes(it.cta)?it.cta:""].filter(Boolean).join("\n\n");
    const fb=it.captionFb||(it.caption||"").replace(/(^|\s)#\S+/g,"").trim();
    files.push(...media.map(f=>({name:base+f.name,data:f.data})));
    if(it.type!=="story"||ig)files.push({name:base+"copy_instagram.txt",data:ig+"\n"});if(it.type!=="story"||it.captionFb)files.push({name:base+"copy_facebook.txt",data:fb+"\n"});
    if(it.type==="story")files.push({name:base+"stickers.txt",data:(it.frames||[]).map((f,i)=>`Story ${i+1}: ${f.text}${f.sticker?`\n  Sticker: ${f.sticker}`:""}`).join("\n")+"\n"});
    if(it.type==="reel"||st!=="listo")files.push({name:base+"guion.txt",data:textPack(it)});
    const ph=placeholders(it);let reason="";
    if(st==="confirmar"){reason=cut.length?"Texto recortado en la imagen: "+cut.join(" · "):ph.length?"Datos sin verificar: "+ph.join(" · "):it.ownerReview?"Corregido: pendiente de tu revisión final":"Estado “"+label(STATUSES,it.status)+"”: falta aprobación final";
      files.push({name:base+"CONFIRMAR.txt",data:`NO PUBLICAR hasta confirmar.\n\n${cut.length?"Texto que no cabe en la imagen (acórtalo):\n- "+cut.join("\n- ")+"\n\n":""}${ph.length?"Datos marcados para confirmar:\n- "+ph.join("\n- "):it.ownerReview?"Pieza corregida por Claude: revisa el texto final.":"La pieza no está marcada como Terminado en Content HQ."}\n\nCuando lo resuelvas, edita la pieza en Content HQ, márcala como Terminado y vuelve a exportar este paquete.\n`})}
    if(st==="material"){reason="Falta: "+it.pending.join(" · ");files.push({name:base+"PENDIENTE.txt",data:`NO PUBLICAR: falta material real.\n\n- ${it.pending.join("\n- ")}\n\nSigue el Plan de grabación de la Fábrica, sube el video a Biblioteca, agrégalo en el editor de Reel y pulsa “Material recibido”.\n`})}
    const stickers=it.type==="story"?(it.frames||[]).map(f=>f.sticker).filter(Boolean).join(" | "):"";
    for(const[net,h,txt]of[["Instagram",hIG,ig],["Facebook",hFB,fb]])rows.push([p.slot,it.date,`${pad2(h.h)}:00`,tz,dow,net,pubType(net,it.type,media.filter(f=>/\.png$/.test(f.name)&&!/portada/.test(f.name)).length||1),media.map(f=>base+f.name).join(" | "),it.type==="story"?"":txt,prod?prod.url:"",stickers,manual?"Manual: agregar stickers en la app":"Automático",PUB_LABEL[st],st==="listo"?"SI":"NO",reason,h.src].map(q))}
  const readme=`PAQUETE DE PROGRAMACIÓN · Semana del ${fmtShort(doc.start)} al ${fmtShort(addD(doc.start,6))}\n\n01_listos_para_programar/  ${cnt.listo} pieza(s) con archivos completos y datos verificados.\n02_requieren_confirmacion/ ${cnt.confirmar} pieza(s) con datos sin verificar: NO programar hasta resolver CONFIRMAR.txt.\n03_requieren_material/     ${cnt.material} pieza(s) a las que les falta grabación o foto real: NO programar.\n\nmanifiesto_programacion.csv: una fila por red (Instagram y Facebook). Programa solo las filas con publicable = SI.\nNombres: fecha_hora_día_formato_título. La hora sale de ${doc.bestTimes?doc.bestTimes.source:"un horario predeterminado"} (zona ${tz}).\nCarruseles: 1080×1350 (4:5) para feed de Instagram y Facebook. Stories y portadas de Reel: 1080×1920 (9:16).\nStories con sticker (encuesta, quiz, preguntas, enlace): modo_publicacion = Manual. La API de Instagram y Facebook no coloca stickers interactivos; publícalas desde la app (en Metricool con aviso al celular) y agrega el sticker de stickers.txt donde está el recuadro rosa.\nImágenes en JPEG: el formato que acepta la publicación por API de Instagram.\n\nContent HQ no publica ni programa en ninguna cuenta.\n`;
  files.unshift({name:"manifiesto_programacion.csv",data:"﻿"+rows.map(r=>r.join(",")).join("\n")+"\n"},{name:"LEEME.txt",data:readme});
  return{files,cnt}}
/* Shooting plan: authored plan (doc.shootPlan) or an automatic list grouped by product */
function autoShootPlan(doc){const groups={};(doc.proposals||[]).filter(p=>p.type==="reel"&&p.state!=="descartada").forEach(p=>{if(fabReadiness(p).ready)return;const k=p.productId||"general";(groups[k]=groups[k]||[]).push(p)});
  return{title:"Lista de tomas por producto",stations:Object.entries(groups).map(([k,ps],i)=>{const prod=catById(k);return{id:"A"+(i+1),name:prod?prod.title:"Tema general",where:"",shots:ps.flatMap(p=>(p.shots||[]).filter(s=>s.footage).map((s,j)=>({id:`${p.slot}-${j+1}`,reel:p.slot,reelTitle:p.title,desc:s.footage,dur:s.duration})))}})}}
function shootPlanText(sp){return[sp.title,sp.summary||"","",...(sp.setup||[]).map(x=>"[ ] "+x),...(sp.materials||[]).map(m=>`[ ] ${m.item}${m.sku?` (SKU ${m.sku})`:""}${m.qty?` × ${m.qty}`:""}`),"",
  ...(sp.stations||[]).flatMap(st=>[`${st.id}. ${st.name}${st.time?` · ${st.time}`:""}`,st.where?`   ${st.where}`:"",st.settings?`   iPhone: ${st.settings}`:"",...(st.shots||[]).map(s=>`   [ ] ${s.id} · ${s.desc}${s.dur?` (${s.dur} s)`:""}${s.reelTitle?` → ${s.reelTitle}`:""}${s.how?`\n       ${s.how}`:""}`),""]),
  ...(sp.after||[]).map(x=>"→ "+x)].filter(x=>x!=null).join("\n")}
function shootPlanHTML(doc){const sp=doc.shootPlan||autoShootPlan(doc);if(!sp.stations||!sp.stations.length)return"";const ck=doc.shootChecks||{};
  const all=sp.stations.flatMap(s=>s.shots||[]);const done=all.filter(s=>ck[s.id]).length;
  return`<section class="panel shoot" id="shoot" style="margin-top:18px"><div class="row" style="justify-content:space-between;align-items:end"><div><div class="eyebrow">Plan de grabación · iPhone</div><h2 style="font-size:1.7rem">${esc(sp.title||"Plan de grabación")}</h2>${sp.summary?`<p class="ai-help" style="margin:4px 0 0;max-width:70ch">${esc(sp.summary)}</p>`:""}</div>
   <div class="row"><span class="chip" id="shoot_count">${done}/${all.length} tomas</span><button id="shoot_dl">Descargar plan (.txt)</button></div></div>
   ${(sp.setup||[]).length||(sp.materials||[]).length?`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:12px">${(sp.materials||[]).length?`<div><h3>Materiales</h3><ul class="shoot-list">${sp.materials.map(m=>`<li><b>${esc(m.item)}</b>${m.sku?` <span class="chip">${esc(m.sku)}</span>`:""}${m.qty?` × ${esc(String(m.qty))}`:""}${m.for?`<small> · ${esc(m.for)}</small>`:""}</li>`).join("")}</ul></div>`:""}${(sp.setup||[]).length?`<div><h3>Antes de empezar</h3><ul class="shoot-list">${sp.setup.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}</div>`:""}
   ${sp.stations.map(st=>`<div class="station"><div class="row" style="justify-content:space-between"><h3>${esc(st.id)} · ${esc(st.name)}</h3>${st.time?`<span class="chip">${esc(st.time)}</span>`:""}</div>${st.where?`<p class="ai-help" style="margin:2px 0">${esc(st.where)}</p>`:""}${st.settings?`<p class="ai-help" style="margin:2px 0"><b>iPhone:</b> ${esc(st.settings)}</p>`:""}
     ${(st.shots||[]).map(s=>`<label class="shot-ck${ck[s.id]?" done":""}"><input type="checkbox" data-shot="${esc(s.id)}" ${ck[s.id]?"checked":""}><span><b>${esc(s.id)}</b> ${esc(s.desc)}${s.dur?` <span class="chip">${esc(String(s.dur))} s</span>`:""}${s.reelTitle?`<small>Reel: ${esc(s.reelTitle)}</small>`:""}${s.how?`<small>${esc(s.how)}</small>`:""}</span></label>`).join("")}</div>`).join("")}
   ${(sp.after||[]).length?`<div class="station"><h3>Después de grabar</h3><ol class="shoot-list">${sp.after.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`:""}</section>`}

/* ================= Boot ================= */
(async()=>{
  try{await Store.init();const d=await Store.load();S.items=d.items.map(x=>newItem(x));S.media=d.media;S.campaigns=d.campaigns||[];S.series=d.series||[];S.catalog=d.catalog||[];S.weeks=d.weeks||[];S.requests=d.requests||[];
    $("#storageInfo").innerHTML=Store.mode==="cloud"?'<span class="lg">Guardado en </span>la nube de Claude':'<span class="lg">Guardado en </span>este navegador';}
  catch(e){$("#view").innerHTML=`<div class="err">${esc(e.message||e)}</div>`;return}
  route();
})();
</script>
