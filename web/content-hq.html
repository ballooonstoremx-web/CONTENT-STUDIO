<title>Balloon Store Content HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: left rail of production stations + work surface; brand palette drives status color coding */
:root{
  --navy:#122D50;--blue:#54C1FA;--pink:#EA4566;--orange:#FF8A00;--yellow:#FFD400;--green:#7ED957;
  --bg:#F5F8FC;--surface:#FFFFFF;--surface2:#EAF2FA;--fg:#122D50;--muted:#556B86;--line:#D4E0EC;
  --accent:#EA4566;--accentfg:#FFFFFF;--danger:#C2213F;--ok:#2F8F1F;--focus:#FFF6C7;--focusline:#F2DB6B;--ink:#122D50;--inkfg:#FFFFFF;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A2E;--surface:#122D50;--surface2:#183A63;--fg:#EAF4FF;--muted:#A8BCD3;--line:#2A4C77;--accent:#FF6F8A;--accentfg:#0B1A2E;--danger:#FF7D93;--ok:#9BE77F;--focus:#2E2A12;--focusline:#6B5E1C;--ink:#EAF4FF;--inkfg:#0B1A2E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1A2E;--surface:#122D50;--surface2:#183A63;--fg:#EAF4FF;--muted:#A8BCD3;--line:#2A4C77;--accent:#FF6F8A;--accentfg:#0B1A2E;--danger:#FF7D93;--ok:#9BE77F;--focus:#2E2A12;--focusline:#6B5E1C;--ink:#EAF4FF;--inkfg:#0B1A2E;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.7rem}h2{font-size:1.35rem}h3{font-size:1.05rem}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
nav.rail{background:var(--navy);color:#fff;padding-block:18px;padding-inline:14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1.1;margin-bottom:12px}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#9fd9fb}
.dots{display:flex;gap:4px;margin:6px 0 2px}.dots i{width:10px;height:10px;border-radius:50%}
nav.rail a{color:#dbe9f7;text-decoration:none;padding:8px 10px;border-radius:8px;font-weight:600}
nav.rail a:hover{background:#1d4270}nav.rail a.on{background:#fff;color:var(--navy)}
nav.rail a:focus-visible{outline:2px solid var(--yellow)}
.storage{margin-top:auto;font-size:.75rem;color:#9fb6cf;padding:8px 4px}
main{padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;max-width:1240px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:16px}
.head p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.82rem;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:80px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
button,.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--blue)}
button.primary{background:var(--accent);color:var(--accentfg);border-color:var(--accent)}
button.ghost{background:transparent}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--fg)}
.s-idea{background:#FFF2B3;color:#5a4a00}.s-borrador{background:#D7F0FE;color:#0d4a6b}.s-revision{background:#FFE0C2;color:#7a3b00}.s-terminado{background:#D9F6CC;color:#1f5a12}
.t-reel{border-left:4px solid var(--pink)}.t-carrusel{border-left:4px solid var(--blue)}.t-story{border-left:4px solid var(--orange)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{background:var(--surface2);border-radius:12px;padding:10px;min-width:0}
.col h3{display:flex;justify-content:space-between;margin-bottom:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;min-width:0}
.card .t{font-weight:700;overflow-wrap:anywhere}
.card .m{font-size:.78rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0;display:flex;flex-direction:column}
.mcard .thumb{aspect-ratio:4/5;background:var(--surface2);display:grid;place-items:center;overflow:hidden;max-width:100%}
.mcard .thumb img,.mcard .thumb video{width:100%;height:100%;object-fit:cover}
.mcard .body{padding:8px;display:flex;flex-direction:column;gap:6px;font-size:.8rem}
.mcard.sel{outline:3px solid var(--pink)}
.drop{border:2px dashed var(--blue);border-radius:12px;padding:22px;text-align:center;background:var(--surface)}
.drop.over{background:var(--surface2)}
.warn{background:#FFF4D6;color:#5d4300;border:1px solid #F0D27A;border-radius:10px;padding:10px 12px;font-size:.88rem}
.err{background:#FFE3E8;color:#7d0f24;border:1px solid #F3A6B5;border-radius:10px;padding:10px 12px;font-size:.88rem}
.list{display:flex;flex-direction:column;gap:8px}
.idea{display:flex;gap:10px;align-items:start;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.idea div{min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:16px;align-items:start}
canvas.preview{width:100%;max-width:420px;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff}
.slides{display:flex;flex-direction:column;gap:10px}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.slide.cur{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink) inset}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tpl-grid figure{margin:0}.tpl-grid figcaption{font-weight:700;margin-top:6px}.tpl-grid canvas{width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px}
.cal .day{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:92px;padding:4px;min-width:0;font-size:.75rem}
.cal .day.other{opacity:.45}.cal .day.today{border-color:var(--pink)}
.cal .day .n{font-weight:800;font-variant-numeric:tabular-nums}
.cal .ev{display:block;width:100%;text-align:left;border-radius:6px;padding:2px 5px;margin-top:3px;font-size:.72rem;font-weight:700;border:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.shot .thumb{width:90px;aspect-ratio:9/16;background:var(--surface2);border-radius:6px;overflow:hidden}
.shot .thumb img,.shot .thumb video{width:100%;height:100%;object-fit:cover}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem;white-space:pre-wrap;background:var(--surface2);border-radius:8px;padding:10px;overflow:auto;max-height:340px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:0;width:min(680px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(10,25,45,.55)}
dialog form{padding:18px;display:grid;gap:10px;overflow:auto;max-height:88vh}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;z-index:50;max-width:80vw}
.empty{text-align:center;padding:30px;color:var(--muted)}
.hide-sm{}
.eyebrow{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hello{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:18px}
.greet{font-size:clamp(2rem,4.5vw,3rem);font-weight:800;letter-spacing:-.01em}.greet em{font-family:var(--body);font-style:italic;font-weight:600;color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.78rem;color:var(--muted);font-weight:700}
.kpi svg text{font-family:var(--display);fill:var(--fg)}
.kpi.hot{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.today-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
.focus{background:var(--focus);border-color:var(--focusline)}
.bignum{font-family:var(--display);font-size:3rem;font-weight:800;line-height:1;display:flex;align-items:baseline;gap:8px}.bignum span{font-family:var(--body);font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
ol.todo{list-style:none;counter-reset:t;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
ol.todo li{counter-increment:t;display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--focusline)}
ol.todo li::before{content:counter(t);font-family:var(--display);font-weight:800;min-width:1.2em}
ol.todo button{all:unset;cursor:pointer;font-weight:600;overflow-wrap:anywhere}ol.todo button:hover{text-decoration:underline}ol.todo button:focus-visible{outline:2px solid var(--blue)}
.soon{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.soon li{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:.88rem}
.soon .cd{font-family:var(--display);font-weight:800;color:var(--accent)}
.prog{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}.prog div{height:100%;background:var(--ink);border-radius:99px}
.camp-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.countdown{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--inkfg);border-radius:14px;padding:12px 18px}.countdown b{font-family:var(--display);font-size:2.6rem;line-height:1}
.runway{position:relative;min-width:620px;padding-top:24px}
.rw-scale{position:relative;height:20px;margin-left:150px;font-size:.7rem;color:var(--muted)}.rw-scale span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.rw-row{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px;align-items:center;margin:6px 0}
.rw-label{font-weight:700;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw-track{position:relative;height:30px;background:var(--surface2);border-radius:8px}
.rw-bar{position:absolute;top:4px;bottom:4px;border-radius:6px;font-size:.68rem;font-weight:800;padding:3px 6px;overflow:hidden;white-space:nowrap}
.rw-bar.prep{background:#FFE58A;color:#5a4a00}.rw-bar.pub{background:var(--pink);color:#fff}
.rw-dot{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--surface);background:var(--blue)}
.rw-dot.s-terminado{background:var(--green)}.rw-dot.s-revision{background:var(--orange)}
.rw-now{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.75rem;color:var(--muted);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.9rem}
.task.done span{text-decoration:line-through;color:var(--muted)}
.task input[type=checkbox],.fl input[type=checkbox]{width:18px;height:18px;accent-color:var(--pink)}
.stepper{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stepper button{border-radius:999px}.stepper button.on{background:var(--ink);color:var(--inkfg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chips button{padding:4px 12px;font-size:.82rem}.chips button.on{background:var(--ink);color:var(--inkfg);border-color:var(--ink)}
.series{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.scard .ep{font-family:var(--display);font-weight:800;font-size:1.8rem;line-height:1;text-align:right}.scard .ep small{display:block;font-family:var(--body);font-size:.62rem;letter-spacing:.12em;color:var(--muted)}
.film-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.film-card .hookline{font-family:var(--display);font-size:1.5rem;font-weight:800;line-height:1.15}
.film .film-card .hookline{font-size:2.3rem}.film .fl{font-size:1.2rem}
.clap{height:10px;border-radius:4px;background:repeating-linear-gradient(135deg,var(--ink) 0 14px,var(--surface) 14px 28px)}
.fl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:6px 0;border-top:1px dashed var(--line)}
.fl.done span{color:var(--muted);text-decoration:line-through}
.week7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;min-width:640px}
.week7 .d{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;min-height:110px;font-size:.75rem}
.week7 .d.today{border-color:var(--accent)}
.funnel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fstep{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;position:relative;min-width:0}
.fstep b{font-family:var(--display);font-size:1.9rem;display:block;font-variant-numeric:tabular-nums}
.fstep.leak{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger) inset}
.leaktag{position:absolute;top:-10px;right:10px;background:var(--danger);color:#fff;font-size:.65rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:2px 8px}
.convs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;background:var(--focus);border:1px solid var(--focusline);border-radius:12px;padding:12px;margin-bottom:12px}
.convs b{font-family:var(--display);font-size:1.6rem;display:block}
.insight{background:var(--focus);border:1px solid var(--focusline);border-radius:14px;padding:16px}
table.met{border-collapse:collapse;width:100%;min-width:820px;font-size:.85rem}table.met th,table.met td{border-bottom:1px solid var(--line);padding:6px;text-align:left}table.met input{width:90px;padding:4px 6px}
main a:not(.btn):not(.panel){color:inherit;text-decoration-color:var(--accent);text-underline-offset:3px}
.rail .sec{font-size:.62rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7fa6cc;margin:10px 10px 2px}
@media (max-width:860px){
  .today-grid{grid-template-columns:1fr}
  nav.rail .sec{display:none}
  .app{grid-template-columns:1fr}
  nav.rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding-block:8px;z-index:5}
  nav.rail .brand,nav.rail .storage{display:none}
  nav.rail a{white-space:nowrap}
  .kanban{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:1fr}
  .cal .day{min-height:64px}
}
@media (max-width:480px){.kanban{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
"use strict";
/* ================= Brand (single source in app; mirrors brand/profile.json) ================= */
const BRAND={name:"Balloon Store",site:"balloonstoreco.com",
  colors:{blue:"#54C1FA",pink:"#EA4566",orange:"#FF8A00",yellow:"#FFD400",green:"#7ED957",navy:"#122D50"},
  lines:["Globos metálicos Anagram","Globos metálicos Kaleidoscope","Látex Sensacional","Varias líneas"],
  audiences:["decoradoras","tiendas de fiestas","revendedores"]};
const STATUSES=[["idea","Ideas"],["borrador","Borradores"],["revision","Pendiente de aprobación"],["terminado","Terminado"]];
const TYPES=[["reel","Reel"],["carrusel","Carrusel"],["story","Stories"]];
const PILLARS=["Educativo","Inspiración","Producto real","Detrás de cámaras","Temporada","Comunidad"];
const OCCASIONS=["cumpleaños","baby shower","graduaciones","bodas y XV años","Día de las Madres","San Valentín","Navidad","fiestas patrias","Halloween y Día de Muertos","eventos corporativos","revelación de género"];
const label=(arr,k)=>(arr.find(a=>a[0]===k)||[k,k])[1];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=(s,r=document)=>r.querySelector(s);const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function toast(msg){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
const slug=s=>String(s||"contenido").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48)||"contenido";
const hasClaude=()=>!!(window.claude&&typeof window.claude.use==="function");
function withTimeout(p,ms){return Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))])}

/* ================= Storage: claude.ai db+assets when hosted, IndexedDB otherwise ================= */
const COLS=["items","media","campaigns","series"];
const IDB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open("bs-content-hq",2);r.onupgradeneeded=()=>{const d=r.result;["items","media","blobs","campaigns","series"].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};r.onsuccess=()=>{this.db=r.result;res(this)};r.onerror=()=>rej(r.error)})},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=()=>rej(t.error)})},
  all(store){return new Promise((res,rej)=>{const t=this.db.transaction(store,"readonly");const r=t.objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})},
  get(store,key){return new Promise((res,rej)=>{const r=this.db.transaction(store,"readonly").objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  put(store,key,val){return this.tx(store,"readwrite",s=>s.put(val,key))},
  del(store,key){return this.tx(store,"readwrite",s=>s.delete(key))}};
const Store={mode:"idb",cdb:null,assets:null,urls:new Map(),queues:new Map(),
  async init(){
    let cloud=false;
    if(hasClaude()){
      try{this.cdb=await withTimeout(window.claude.use("db"),12000)}catch(e){this.cdb=null}
      if(this.cdb){try{const probe=await withTimeout(this.cdb.collection("items").limit(1).get(),12000);cloud=!!probe}catch(e){cloud=false}}
      try{this.assets=await withTimeout(window.claude.use("assets"),8000)}catch(e){this.assets=null}
    }
    try{await IDB.open()}catch(e){if(!cloud)throw new Error("Este navegador no permite guardar datos (IndexedDB bloqueado). Desactiva el modo privado.")}
    this.mode=cloud?"cloud":"idb";
    if(!cloud&&navigator.storage&&navigator.storage.persist){try{await navigator.storage.persist()}catch(e){}}
  },
  async load(){
    if(this.mode==="cloud"){
      const snaps=await Promise.all(COLS.map(c=>withTimeout(this.cdb.collection(c).get(),15000)));
      if(snaps.some(x=>!x))throw new Error("La nube no respondió en 15 s. Recarga la página.");
      return Object.fromEntries(COLS.map((c,i)=>[c,snaps[i].docs.map(d=>d.data())]));
    }
    const out={};for(const c of COLS)out[c]=await IDB.all(c);return out;
  },
  clean(o){return JSON.parse(JSON.stringify(o))},
  serial(key,fn){const prev=this.queues.get(key)||Promise.resolve();const next=prev.catch(()=>{}).then(fn);this.queues.set(key,next);return next},
  save(col,obj){const data=this.clean(obj);return this.serial(col+"/"+obj.id,()=>this.mode==="cloud"?this.cdb.collection(col).doc(obj.id).set(data):IDB.put(col,obj.id,data))},
  remove(col,id){return this.serial(col+"/"+id,()=>this.mode==="cloud"?this.cdb.collection(col).doc(id).delete():IDB.del(col,id))},
  async putBlob(file){
    const MAX=20*1024*1024;
    if(this.mode==="cloud"&&this.assets&&file.size<=MAX){
      try{const r=await this.assets.upload(file,{type:file.type});return{kind:"asset",id:r.id}}catch(e){console.warn("assets.upload",e)}
    }
    if(!IDB.db)throw new Error("No hay almacenamiento disponible para archivos.");
    const key=uid();await IDB.put("blobs",key,file);return{kind:"idb",key,localOnly:this.mode==="cloud"};
  },
  async getBlob(ref){
    if(!ref)return null;
    if(ref.kind==="asset"){const r=await fetch("/_blob/"+ref.id);if(!r.ok)throw new Error("No se pudo leer el archivo "+ref.id);return await r.blob()}
    if(!IDB.db)return null;return(await IDB.get("blobs",ref.key))||null;
  },
  async url(ref){
    if(!ref)return"";const k=ref.kind==="asset"?ref.id:ref.key;
    if(this.urls.has(k))return this.urls.get(k);
    const b=await this.getBlob(ref);if(!b)return"";const u=URL.createObjectURL(b);this.urls.set(k,u);return u;
  },
  async dropBlob(ref){
    if(!ref)return;
    try{if(ref.kind==="asset"&&this.assets)await this.assets.delete(ref.id);else if(ref.kind==="idb"&&IDB.db)await IDB.del("blobs",ref.key)}catch(e){console.warn(e)}
  }
};

let dlCap;
async function saveFile(name,blob){
  if(hasClaude()){
    if(dlCap===undefined){try{dlCap=await withTimeout(window.claude.use("downloads"),8000)}catch(e){dlCap=null}}
    if(dlCap){
      try{await dlCap.save({filename:name,data:blob});toast("Descargado: "+name);return true}
      catch(e){const c=e&&e.code;toast(c==="declined"?"Descarga cancelada":"No se pudo descargar ("+(c||"error")+")");return false}
    }
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast("Descargado: "+name);return true;
}

/* ================= ZIP writer (STORE, CRC32) — no external dependency ================= */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
async function makeZip(files){ // files: [{name, data: Blob|string}]
  const enc=new TextEncoder();const parts=[];const central=[];let offset=0;
  const now=new Date();const dosT=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);const dosD=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  for(const f of files){
    const data=typeof f.data==="string"?enc.encode(f.data):new Uint8Array(await f.data.arrayBuffer());
    const name=enc.encode(f.name);const crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,dosT,true);lh.setUint16(12,dosD,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(lh.buffer,name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,dosT,true);ch.setUint16(14,dosD,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,name.length,true);ch.setUint32(42,offset,true);
    central.push(ch.buffer,name);offset+=30+name.length+data.length;
  }
  const cSize=central.reduce((s,p)=>s+(p.byteLength??p.length),0);
  const end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cSize,true);end.setUint32(16,offset,true);
  return new Blob([...parts,...central,end.buffer],{type:"application/zip"});
}

function genIdeas({type,occasion,line,audience,count}){
  const out=[];const types=type==="todos"?["reel","carrusel","story"]:[type];
  let n=0;const seed=Math.floor(Math.random()*100);
  while(out.length<count&&n<60){const t=types[n%types.length];const bank=IDEA_BANK[t];const tpl=pick(bank,seed+n);
    const o=occasion==="variado"?pick(OCCASIONS,seed+n*3):occasion;const l=line;

  return out;

function wrap(ctx,text,maxW){const words=String(text||"").split(/\s+/).filter(Boolean);const lines=[];let line="";
  for(const w of words){const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}if(line)lines.push(line);return lines}
function drawText(ctx,text,x,y,maxW,size,lh,font,color,maxLines=8,align="left"){
  ctx.font=font.replace("{s}",size);ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline="top";
  let lines=[];String(text||"").split("\n").forEach(p=>lines.push(...wrap(ctx,p,maxW)));lines=lines.slice(0,maxLines);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*size*lh));return y+lines.length*size*lh}

  <div class="media-grid" id="mg">${list.length?"":'<div class="empty">Sin archivos todavía.</div>'}</div>`;
  $("#flt",main).value=flt;$("#flt",main).onchange=e=>{S.libFilter=e.target.value;route()};
  $("#pick",main).onclick=()=>$("#filePick").click();
  const drop=$("#drop",main);drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")};drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");uploadFiles([...e.dataTransfer.files])};
  const mg=$("#mg",main);
  list.forEach(m=>{const el=document.createElement("div");el.className="mcard";
    el.innerHTML=`<div class="thumb"></div><div class="body"><b style="overflow-wrap:anywhere">${esc(m.name)}</b><span style="color:var(--muted)">${m.mime.startsWith("video")?"Video"+(m.duration?" · "+m.duration.toFixed(1)+" s":""):"Foto"+(m.width?" · "+m.width+"×"+m.height:"")} · ${(m.size/1048576).toFixed(1)} MB${m.ref&&m.ref.localOnly?" · solo este navegador":""}</span>
      <label>Etiquetas (separa con comas)<input data-tags value="${esc((m.tags||[]).join(", "))}" placeholder="producto exacto, ocasión, color"></label>
      <div class="row"><button data-dl>Descargar</button><button class="danger" data-rm>Eliminar</button></div><div data-cf></div></div>`;
    mg.appendChild(el);
    Store.url(m.ref).then(u=>{if(!u)return;const t=$(".thumb",el);t.innerHTML=m.mime.startsWith("video")?`<video src="${u}" muted playsinline preload="metadata" controls></video>`:`<img src="${u}" alt="${esc(m.name)}">`});
    $("[data-tags]",el).onchange=e=>{m.tags=e.target.value.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);Store.save("media",m).then(()=>toast("Etiquetas guardadas"))};
    $("[data-dl]",el).onclick=async()=>{const b=await Store.getBlob(m.ref);if(b)saveFile(m.name,b);else toast("Archivo no disponible en este navegador")};
    $("[data-rm]",el).onclick=()=>{const used=S.items.filter(i=>i.slides.some(s=>s.mediaId===m.id)||i.shots.some(s=>s.mediaId===m.id));
      $("[data-cf]",el).innerHTML=`<p style="margin:0">${used.length?"Se usa en "+used.length+" contenido(s). ":""}¿Eliminar?</p><button class="danger" data-yes>Sí, eliminar</button>`;
      $("[data-yes]",el).onclick=async()=>{used.forEach(i=>{i.slides.forEach(s=>{if(s.mediaId===m.id)s.mediaId=""});i.shots=i.shots.filter(s=>s.mediaId!==m.id);touch(i,true)});
        await Store.dropBlob(m.ref);await Store.remove("media",m.id);S.media=S.media.filter(x=>x.id!==m.id);imgCache.delete(m.id);toast("Archivo eliminado");route()}};
  });
};
$("#filePick").onchange=e=>{uploadFiles([...e.target.files]);e.target.value=""};
function probe(file,url){return new Promise(res=>{
  if(file.type.startsWith("video")){const v=document.createElement("video");v.preload="metadata";v.muted=true;v.onloadedmetadata=()=>res({duration:v.duration||0,width:v.videoWidth,height:v.videoHeight});v.onerror=()=>res({});v.src=url;setTimeout(()=>res({}),6000)}
  else{const i=new Image();i.onload=()=>res({width:i.naturalWidth,height:i.naturalHeight});i.onerror=()=>res({});i.src=url}})}
async function uploadFiles(files){
  const ok=files.filter(f=>/^(image|video)\//.test(f.type));if(ok.length<files.length)toast("Solo se aceptan fotos y videos");
  const box=$("#upl");let done=0;
  for(const f of ok){if(box)box.textContent=`Subiendo ${done+1} de ${ok.length}: ${f.name}`;
    try{const tmp=URL.createObjectURL(f);const meta=await probe(f,tmp);URL.revokeObjectURL(tmp);
      const ref=await Store.putBlob(f);
      const m={id:uid(),name:f.name,mime:f.type,size:f.size,tags:[],ref,createdAt:new Date().toISOString(),...meta};
      await Store.save("media",m);S.media.push(m);done++}
    catch(e){toast("No se subió "+f.name+": "+(e.message||e.code||e))}}
  toast(`${done} archivo(s) guardado(s)`);if((location.hash||"#panel")==="#biblioteca")route();
}

async function buildCarouselZip(it){
  const miss=it.slides.filter(s=>s.template==="producto"&&!s.mediaId);if(miss.length)throw new Error("Falta foto real en diapositivas de producto");
  const files=[];const n=it.slides.length;
  for(let i=0;i<n;i++){const c=document.createElement("canvas");await renderSlide(c,it.slides[i],{index:i+1,total:n});files.push({name:`slides/${String(i+1).padStart(2,"0")}.png`,data:await canvasBlob(c)})}
  files.push({name:"copy.txt",data:textPack(it)});
  files.push({name:"ficha.json",data:JSON.stringify({title:it.title,status:it.status,date:it.date,format:"1080x1350 PNG",slides:it.slides.map((s,i)=>({n:i+1,template:s.template,headline:s.headline,photo:s.mediaId?(mediaById(s.mediaId)||{}).name:null})),exportedAt:new Date().toISOString(),site:BRAND.site},null,2)});
  files.push({name:"LEEME.txt",data:`Carrusel: ${it.title}\nSube las imágenes de /slides en orden (01, 02, …) a Instagram o Facebook.\nPega el texto de copy.txt como pie de publicación.\nAntes de publicar: confirma que no queda texto marcado ${PH} y que las fotos son del producto real.\nEsta herramienta no publica en redes sociales.\n`});
  return makeZip(files);
}

/* ---- Reel ---- */
const fmtT=s=>{const m=Math.floor(s/60),r=(s-m*60);return String(m).padStart(2,"0")+":"+r.toFixed(1).padStart(4,"0")};
const srtT=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=Math.floor(s%60),ms=Math.round((s-Math.floor(s))*1000);return`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")},${String(ms).padStart(3,"0")}`};
function reelTimeline(it){let t=0;return it.shots.map((s,i)=>{const m=mediaById(s.mediaId)||{};const isV=(m.mime||"").startsWith("video");const inn=+s.in||0;let dur=+s.dur||(isV?Math.min(3,(m.duration||3)-inn):2.5);
  if(isV&&m.duration)dur=Math.max(.3,Math.min(dur,m.duration-inn));const row={n:i+1,file:`clips/${String(i+1).padStart(2,"0")}_${slug((m.name||"clip").replace(/\.[^.]+$/,""))}${(m.name||"").match(/\.[^.]+$/)?.[0]||""}`,media:m,isV,in:inn,out:inn+dur,start:t,end:t+dur,dur,text:s.text||"",voice:s.voice||"",note:s.note||""};t+=dur;return row})}
function capcutGuide(it,tl){const total=tl.length?tl[tl.length-1].end:0;
  return`# Instrucciones de edición en CapCut — ${it.title}

Duración estimada: ${total.toFixed(1)} s · ${tl.length} tomas · Formato 9:16

## 1. Proyecto
1. Abre CapCut (escritorio o móvil) → **Nuevo proyecto**.
2. Relación de aspecto **9:16**. En escritorio: Proyecto 1080×1920, 30 fps.
3. Importa la carpeta \`clips/\` de este paquete. Los archivos ya están numerados en el orden de la línea de tiempo.

## 2. Línea de tiempo
| # | Archivo | Recorte dentro del clip | Posición en el Reel | Texto en pantalla | Voz en off | Nota de edición |
|---|---|---|---|---|---|---|
${tl.map(r=>`| ${r.n} | ${r.file} | ${r.isV?fmtT(r.in)+" → "+fmtT(r.out):"foto · "+r.dur.toFixed(1)+" s"} | ${fmtT(r.start)} → ${fmtT(r.end)} | ${(r.text||"—").replace(/\|/g,"/")} | ${(r.voice||"—").replace(/\|/g,"/")} | ${(r.note||"—").replace(/\|/g,"/")} |`).join("\n")}

Pasos:
1. Arrastra los clips en orden 01, 02, 03… a la pista principal.
2. Recorta cada clip a los tiempos de “Recorte dentro del clip” (selecciona el clip → Dividir en la entrada y en la salida → elimina el resto).
3. Para fotos, ajusta la duración indicada. Usa “Ken Burns”/zoom suave si quieres movimiento.
4. Encuadre: si el clip es horizontal, usa **Lienzo → Desenfoque** o recorta a 9:16 manteniendo el producto completo y visible.

## 3. Textos y subtítulos
- Importa \`subtitulos.srt\` (Texto → Subtítulos → Importar subtítulos). Si tu versión no lo permite, usa **Subtítulos automáticos** y corrígelos con \`textos-en-pantalla.txt\`.
- Hook en pantalla los primeros 3 s: “${it.hook||it.title}”.
- Zona segura: deja libres ~220 px arriba y ~420 px abajo (interfaz de Instagram).
- Tipografía sugerida: gruesa y redondeada; colores de marca azul #54C1FA, rosa #EA4566, amarillo #FFD400 sobre azul marino #122D50.

## 4. Audio
- Graba la voz en off con el guion de \`guion.txt\` (o usa los textos por toma de la tabla).
- Música: solo de la biblioteca de CapCut con licencia comercial o audio original. No uses canciones con derechos en una cuenta de empresa.
- Baja la música a −18/−20 dB cuando haya voz.

## 5. Portada y exportación
- Usa \`portada-1080x1920.png\` como portada al subir el Reel.
- Exporta: resolución 1080p, 30 fps, MP4, tasa de bits recomendada.
- Revisión final: producto real visible, sin precios ni existencias no confirmadas, sin texto marcado ${PH}.

Esta herramienta no publica en redes sociales; la publicación es manual y requiere aprobación.
`}
function srt(tl){let n=0;return tl.filter(r=>r.voice||r.text).map(r=>`${++n}\n${srtT(r.start)} --> ${srtT(r.end)}\n${r.voice||r.text}\n`).join("\n")}
async function renderReelCover(c,it){
  await ensureFonts();const W=1080,H=1920;c.width=W;c.height=H;const ctx=c.getContext("2d");const C=BRAND.colors;
  const first=it.shots.map(s=>mediaById(s.mediaId)).find(Boolean);const img=first?await loadMediaImage(first):null;
  ctx.fillStyle=C.navy;ctx.fillRect(0,0,W,H);if(img)cover(ctx,img,0,0,W,H);
  const g=ctx.createLinearGradient(0,H*.4,0,H);g.addColorStop(0,"rgba(18,45,80,0)");g.addColorStop(1,"rgba(18,45,80,.9)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=C.yellow;ctx.fillRect(80,H*.58-28,160,14);
  const y=drawText(ctx,it.hook||it.title,80,H*.58,W-160,96,1.04,DISPLAY,"#FFFFFF",4);
  drawText(ctx,BRAND.site,80,Math.min(y+36,H-460),W-160,36,1,"700 {s}px 'Nunito Sans', sans-serif",BRAND.colors.yellow,1);
}

  $("#r_zip",main).onclick=async e=>{e.target.disabled=true;e.target.textContent="Generando…";try{await saveFile(slug(it.title)+"-reel-capcut.zip",await buildReelZip(it))}catch(err){toast(err.message)}finally{e.target.disabled=false;e.target.textContent="Exportar paquete ZIP"}};

async function buildReelZip(it){
  if(!it.shots.length)throw new Error("Agrega al menos una toma con material real");
  const tl=reelTimeline(it);const files=[];const seen=new Set();
  for(const r of tl){if(!r.media||!r.media.ref)throw new Error("La toma "+r.n+" no tiene archivo; vuelve a agregarla");
    const b=await Store.getBlob(r.media.ref);if(!b)throw new Error("No se encontró el archivo de la toma "+r.n+" en este navegador");
    if(!seen.has(r.file)){files.push({name:r.file,data:b});seen.add(r.file)}}
  const c=document.createElement("canvas");await renderReelCover(c,it);files.push({name:"portada-1080x1920.png",data:await canvasBlob(c)});
  files.push({name:"instrucciones-capcut.md",data:capcutGuide(it,tl)});
  files.push({name:"subtitulos.srt",data:srt(tl)||"1\n00:00:00,000 --> 00:00:03,000\n"+(it.hook||it.title)+"\n"});
  files.push({name:"textos-en-pantalla.txt",data:tl.map(r=>`${r.n}. [${fmtT(r.start)}–${fmtT(r.end)}] ${r.text||"(sin texto)"}`).join("\n")+"\n"});
  files.push({name:"guion.txt",data:`HOOK\n${it.hook}\n\nGUION\n${it.script}\n\nVOZ POR TOMA\n${tl.map(r=>`${r.n}. ${r.voice||"—"}`).join("\n")}\n`});
  files.push({name:"copy-instagram.txt",data:it.caption||genCaption(it)});
  files.push({name:"LEEME.txt",data:`Paquete de Reel: ${it.title}\n1. Descomprime este ZIP.\n2. Sigue instrucciones-capcut.md.\n3. Material incluido: ${tl.length} archivo(s) real(es) en /clips.\nEsta herramienta no publica en redes sociales.\n`});
  return makeZip(files);
}

/* ================= Date helpers ================= */
const DAY=86400000;
const isoD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseD=s=>{const[y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return isoD(d)};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/DAY);
const weekStart=s=>{const d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return isoD(d)};
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESL=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const fmtShort=s=>{const d=parseD(s);return d.getDate()+" "+MES[d.getMonth()]};
const fmtLong=s=>{const d=parseD(s);return DIAS[d.getDay()]+" "+d.getDate()+" de "+MESL[d.getMonth()]};
function seasons(from){const y=+from.slice(0,4);const out=[];
  for(const yr of[y,y+1]){const j=new Date(yr,5,1);const fathers=isoD(new Date(yr,5,1+((7-j.getDay())%7)+14));
    out.push([`${yr}-01-06`,"Día de Reyes"],[`${yr}-02-14`,"San Valentín"],[`${yr}-04-30`,"Día del Niño"],[`${yr}-05-10`,"Día de las Madres"],[fathers,"Día del Padre"],[`${yr}-09-15`,"Fiestas patrias"],[`${yr}-10-31`,"Halloween"],[`${yr}-11-02`,"Día de Muertos"],[`${yr}-12-25`,"Navidad"],[`${yr}-12-31`,"Año Nuevo"])}
  return out.filter(([d])=>d>=from).sort((a,b)=>a[0]>b[0]?1:-1)}
function ring(v,max,color,big,lbl,hot){const p=max>0?Math.max(0,Math.min(1,v/max)):0;const r=26,c=2*Math.PI*r;
  return`<div class="kpi${hot?" hot":""}"><svg viewBox="0 0 64 64" width="66" height="66" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(p*c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 32 32)"/><text x="32" y="38" text-anchor="middle" font-size="${String(big).length>4?13:17}" font-weight="800">${esc(big)}</text></svg><span>${esc(lbl)}</span></div>`}
const missingPhoto=i=>i.type==="carrusel"&&i.slides.some(s=>s.template==="producto"&&!s.mediaId);
const missingFootage=i=>i.type==="reel"&&!i.shots.length&&["borrador","revision"].includes(i.status);

/* ---- Attention engine: derived only from the user's own data ---- */
function attention(){const t=today();const out=[];
  S.items.forEach(i=>{if(i.status==="terminado")return;
    if(i.date&&i.date<t)out.push({p:0,txt:`Atrasado desde ${fmtShort(i.date)}: ${i.title}`,id:i.id});
    else if(i.status==="revision")out.push({p:1,txt:`Aprobar: ${i.title}`,id:i.id});
    else if(i.date&&daysBetween(t,i.date)<=2)out.push({p:2,txt:`Terminar antes del ${fmtShort(i.date)}: ${i.title}`,id:i.id});
    if(missingPhoto(i))out.push({p:3,txt:`Subir foto real del producto: ${i.title}`,go:"#biblioteca"});
    if(missingFootage(i))out.push({p:3,txt:`Agregar material real al Reel: ${i.title}`,reel:i.id})});
  S.campaigns.forEach(c=>(c.tasks||[]).forEach(k=>{if(!k.done&&k.due&&k.due<=t)out.push({p:k.due<t?0:2,txt:`${c.name}: ${k.text}`,camp:c.id})}));
  return out.sort((a,b)=>a.p-b.p)}
function bindAttention(root,list){$$("[data-att]",root).forEach(b=>b.onclick=()=>{const a=list[+b.dataset.att];
  if(a.id)openEditor(a.id);else if(a.reel){S.cur.reel=a.reel;location.hash="#reel"}else if(a.camp){S.curCamp=a.camp;location.hash="#campanas"}else if(a.go)location.hash=a.go})}

function runway(camps,t){if(!camps.length)return"";let lo=t,hi=addD(t,14);
  camps.forEach(c=>[c.prep||c.start,c.start,c.end].forEach(d=>{if(d<lo)lo=d;if(d>hi)hi=d}));lo=addD(lo,-2);hi=addD(hi,3);
  const span=Math.max(1,daysBetween(lo,hi));const pct=d=>Math.max(0,Math.min(100,daysBetween(lo,d)/span*100));const x=d=>pct(d).toFixed(2)+"%";
  const ticks=[];for(let d=weekStart(addD(lo,6));d<=hi;d=addD(d,7))ticks.push(d);
  return`<div style="overflow-x:auto"><div class="runway"><div class="rw-scale">${ticks.map(d=>`<span style="left:${x(d)}">${fmtShort(d)}</span>`).join("")}</div>
  ${camps.map(c=>{const its=S.items.filter(i=>i.campaignId===c.id&&i.date);const prep=c.prep&&c.prep<c.start;
   return`<div class="rw-row"><div class="rw-label" title="${esc(c.name)}">${esc(c.name)}</div><div class="rw-track">
   ${prep?`<div class="rw-bar prep" style="left:${x(c.prep)};width:${(pct(c.start)-pct(c.prep)).toFixed(2)}%">Preparar</div>`:""}
   <div class="rw-bar pub" style="left:${x(c.start)};width:${Math.max(1,pct(addD(c.end,1))-pct(c.start)).toFixed(2)}%">Publicar</div>
   ${its.map(i=>`<span class="rw-dot s-${i.status}" style="left:${x(i.date)}" title="${esc(i.title)} · ${esc(label(STATUSES,i.status))}"></span>`).join("")}
   <i class="rw-now" style="left:${x(t)}" title="Hoy"></i></div></div>`}).join("")}</div></div>
  <div class="legend"><span><i style="background:#FFE58A"></i>Preparar</span><span><i style="background:var(--pink)"></i>Publicar</span><span><i style="background:var(--blue);border-radius:50%"></i>Pieza programada</span><span><i style="background:var(--green);border-radius:50%"></i>Pieza terminada</span><span><i style="background:var(--ink)"></i>Hoy</span></div>`}

const MET=[["reach","Alcance"],["saves","Guardados"],["shares","Compartidos"],["profile","Visitas al perfil"],["clicks","Clics al sitio"],["dms","Mensajes"]];
const FUNNEL=[["reach","Alcance"],["profile","Visitas al perfil"],["clicks","Clics al sitio"],["dms","Mensajes"]];
const LEAK_TIPS={profile:"Pocas personas pasan al perfil. Prueba hooks que prometan algo que se completa en el perfil y una CTA explícita para visitarlo.",clicks:"Visitan el perfil pero no van al sitio. Revisa el enlace de la bio y que la CTA diga qué encontrarán en balloonstoreco.com.",dms:"Llegan pero no escriben. Cierra con una pregunta concreta que se responda por mensaje directo."};

VIEWS.resultados=main=>{
  const t=today();const per=S.resPeriod;const from=per==="7"?addD(t,-7):per==="30"?addD(t,-30):"";
  const pub=S.items.filter(i=>i.status==="terminado").sort((a,b)=>(b.date||"")>(a.date||"")?1:-1);
  const inP=pub.filter(i=>!from||(i.date&&i.date>=from&&i.date<=t));const withData=inP.filter(i=>num((i.metrics||{}).reach)>0);
  const sum=k=>{const v=withData.map(i=>num(i.metrics[k])).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0):null};
  const steps=FUNNEL.map(([k,l])=>({k,l,v:sum(k)}));
  const convs=steps.slice(1).map((s,i)=>{const a=steps[i];return{from:a,to:s,pct:a.v&&s.v!=null?s.v/a.v*100:null}});
  const known=convs.filter(c=>c.pct!=null);const leak=known.length?known.reduce((m,c)=>c.pct<m.pct?c:m):null;
  const ranked=withData.map(i=>({i,r:((num(i.metrics.saves)||0)+(num(i.metrics.shares)||0))/num(i.metrics.reach)*100})).sort((a,b)=>b.r-a.r).slice(0,5);
  const f1=n=>n==null?"—":n.toLocaleString("es-MX");
  main.innerHTML=head("Resultados","Captura las métricas reales de cada pieza publicada (Instagram o Facebook). La app no estima nada: una casilla vacía no cuenta.",`<button id="csv" ${pub.length?"":"disabled"}>Descargar CSV</button>`)+
  `<div class="chips">${[["todo","Todo"],["30","Últimos 30 días"],["7","Últimos 7 días"]].map(([k,l])=>`<button data-per="${k}" class="${k===per?"on":""}">${l}</button>`).join("")}</div>
  ${withData.length?`<div class="convs">${convs.map(c=>`<div><div class="eyebrow">${esc(c.from.l)} → ${esc(c.to.l)}</div><b>${c.pct==null?"—":c.pct.toFixed(1)+"%"}</b><small style="color:var(--muted)">${c.pct==null?"falta capturar "+esc(c.to.l.toLowerCase()):`${f1(c.to.v)} de ${f1(c.from.v)}`}</small></div>`).join("")}</div>
   <div class="funnel">${steps.map((s,k)=>`<div class="fstep${leak&&leak.to.k===s.k?" leak":""}">${leak&&leak.to.k===s.k?'<span class="leaktag">Mayor fuga</span>':""}<div class="eyebrow">${k+1}. ${esc(s.l)}</div><b>${f1(s.v)}</b><div class="prog" style="margin-top:6px"><div style="width:${s.v!=null&&steps[0].v?Math.max(2,s.v/steps[0].v*100):0}%;background:var(--blue)"></div></div></div>`).join("")}</div>
   ${leak?`<div class="insight" style="margin-top:12px"><div class="eyebrow">Dónde se cae</div><h2 style="margin:4px 0">${esc(leak.from.l)} → ${esc(leak.to.l)}: solo ${leak.pct.toFixed(1)}%</h2><p style="margin:0">${esc(LEAK_TIPS[leak.to.k]||"")}</p><p style="margin:6px 0 0;font-size:.8rem;color:var(--muted)">Basado en ${withData.length} publicación(es) con datos${withData.length<3?". Con menos de 3 publicaciones tómalo como señal, no como conclusión.":"."}</p></div>`:""}
   ${ranked.length?`<div class="panel" style="margin-top:12px"><h2>Lo que más guardan y comparten</h2><div class="list" style="margin-top:8px">${ranked.map(x=>`<div class="idea"><div><b>${esc(x.i.title)}</b> <span style="color:var(--muted);font-size:.8rem">${esc(label(TYPES,x.i.type))}${x.i.pillar?" · "+esc(x.i.pillar):""}</span></div><span class="chip">${x.r.toFixed(1)}% del alcance</span></div>`).join("")}</div></div>`:""}`
  :`<div class="panel empty">${pub.length?"Captura al menos el alcance de una pieza publicada para ver el embudo.":"Cuando una pieza esté en “Terminado”, aparecerá aquí para capturar sus métricas."}</div>`}
  ${inP.length?`<div class="panel" style="margin-top:14px"><h2>Métricas por pieza</h2><div style="overflow-x:auto;margin-top:8px"><table class="met"><thead><tr><th>Pieza</th><th>Fecha</th>${MET.map(([,l])=>`<th>${l}</th>`).join("")}</tr></thead><tbody>${inP.map(i=>`<tr><td style="min-width:200px"><b>${esc(i.title)}</b><br><small>${esc(label(TYPES,i.type))}</small></td><td>${i.date?fmtShort(i.date):"—"}</td>${MET.map(([k,l])=>`<td><input type="number" min="0" step="1" inputmode="numeric" data-met="${i.id}" data-k="${k}" value="${(i.metrics||{})[k]??""}" aria-label="${l} de ${esc(i.title)}"></td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`:""}`;
  $$("[data-per]",main).forEach(b=>b.onclick=()=>{S.resPeriod=b.dataset.per;route()});
  $$("[data-met]",main).forEach(inp=>inp.onchange=async()=>{const i=item(inp.dataset.met);const v=inp.value===""?"":Math.max(0,Math.round(+inp.value));i.metrics={...(i.metrics||{}),[inp.dataset.k]:v};await touch(i,true);route()});
  const cs=$("#csv",main);if(cs)cs.onclick=()=>{const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
    const rows=[["titulo","formato","fecha","pilar",...MET.map(m=>m[0])].join(","),...pub.map(i=>[q(i.title),q(label(TYPES,i.type)),q(i.date),q(i.pillar),...MET.map(([k])=>q((i.metrics||{})[k]))].join(","))];
    saveFile("content-hq-resultados-"+t+".csv",new Blob([rows.join("\n")],{type:"text/csv"}))};
};

/* ================= Boot ================= */
(async()=>{
  try{await Store.init();const d=await Store.load();S.items=d.items.map(x=>newItem(x));S.media=d.media;S.campaigns=d.campaigns||[];S.series=d.series||[];
    $("#storageInfo").textContent=Store.mode==="cloud"?"Guardado en tu espacio de Claude":"Guardado en este navegador";}
  catch(e){$("#view").innerHTML=`<div class="err">${esc(e.message||e)}</div>`;return}
  route();
})();
</script>
